<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spain Travel Market 2026 in Seoul — Participant Guide</title>
<meta name="description" content="Participant guide for Spain Travel Market 2026 in Seoul, 25–27 November 2026: schedule, entry requirements, getting around and things to do near your hotel.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Spain Travel Market 2026 in Seoul — Participant Guide">
<meta property="og:description" content="Schedule, entry requirements, getting around and things to do in Seoul · 25–27 Nov 2026">
<link rel="icon" href="turespana-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --fs:1;
  --bg:#f7f4ef; --surface:#ffffff; --ink:#1f1b18; --muted:#62584f; --line:#e3dbd0; --chip:#efe8de;
  --accent:#a8231c; --accent-ink:#ffffff; --gold:#b07a00; --soft:#fbefe6;
  --c12:#a8231c; --c14:#2f5ea8; --c39:#b8560f; --c38:#8a3b78; --c28:#2f7d3e; --cT:#7a5a2b;
  --display:"Fraunces","Noto Sans KR",Georgia,serif;
  --body:"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151210; --surface:#201c19; --ink:#f1ebe4; --muted:#b3a89c; --line:#3a332d; --chip:#2b2521;
  --accent:#ef7a6e; --accent-ink:#1a0f0d; --gold:#e5b54a; --soft:#2c201c;
  --c12:#ef7a6e; --c14:#8fb0ec; --c39:#f0a065; --c38:#d996c6; --c28:#84cf8f; --cT:#d9b07a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151210; --surface:#201c19; --ink:#f1ebe4; --muted:#b3a89c; --line:#3a332d; --chip:#2b2521;
  --accent:#ef7a6e; --accent-ink:#1a0f0d; --gold:#e5b54a; --soft:#2c201c;
  --c12:#ef7a6e; --c14:#8fb0ec; --c39:#f0a065; --c38:#d996c6; --c28:#84cf8f; --cT:#d9b07a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(15.5px*var(--fs));line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:40px}
button{font:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.pill{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.pill button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:calc(13px*var(--fs));padding:5px 13px;cursor:pointer}
.pill button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
header{display:flex;flex-direction:column;gap:18px}
.hero{display:flex;gap:clamp(16px,3vw,28px);align-items:center}
.logo{width:clamp(78px,12vw,112px);height:auto;flex:none;background:#fff;border-radius:14px;padding:8px;box-shadow:0 0 0 1px var(--line)}
.eyebrow{font-family:var(--display);color:var(--accent);font-size:calc(clamp(17px,2.2vw,21px)*var(--fs));font-weight:500}
h1{font-family:var(--display);font-size:calc(clamp(27px,4.4vw,42px)*var(--fs));line-height:1.15;margin:2px 0 4px;font-weight:700}
.sub{color:var(--muted);font-weight:500}
.hotelbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;max-width:780px}
.hotelbox .k{font-size:calc(11.5px*var(--fs));font-weight:700;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.hotelbox b{font-size:calc(16.5px*var(--fs))}
.hotelbox .row{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.hotelbox select{font:inherit;font-size:calc(14px*var(--fs));padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.note{font-size:calc(13px*var(--fs));color:var(--muted);margin:0}

/* nav */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);margin:-16px 0 -16px;padding-top:env(safe-area-inset-top,0px);min-width:0}
.topbar .ctl{padding:10px 0 8px;border-bottom:1px solid var(--line)}
#todoCtl[hidden]{display:none}
.topbar .ctl .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
.topbar .ctl .seg::-webkit-scrollbar{display:none}
.topbar .ctl .seg button{white-space:nowrap;flex:none}
nav.tabs{background:var(--bg);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.hsw{position:relative;min-width:0;max-width:100%}
.hsw>.harr{position:absolute;top:0;bottom:1px;z-index:2;width:36px;border:0;padding:0;cursor:pointer;color:var(--accent);font-size:24px;line-height:1;display:flex;align-items:center}
.hsw>.harr.l{left:0;justify-content:flex-start;padding-left:2px;background:linear-gradient(90deg,var(--bg) 55%,transparent)}
.hsw>.harr.r{right:0;justify-content:flex-end;padding-right:2px;background:linear-gradient(270deg,var(--bg) 55%,transparent)}
.hsw>.harr[hidden]{display:none}
.hsw>.harr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hscroll{cursor:grab;user-select:none;-webkit-user-select:none;overscroll-behavior-x:contain}
.hscroll.drag{cursor:grabbing}
.hscroll.drag a,.hscroll.drag button{pointer-events:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:calc(14px*var(--fs));padding:12px 12px 10px;border-bottom:3px solid transparent}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}

section{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--display);font-size:calc(clamp(23px,3vw,28px)*var(--fs));margin:0;font-weight:700}
.lead{margin:0;color:var(--muted);max-width:760px}

/* schedule */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.day.main{border-color:var(--accent);box-shadow:inset 0 4px 0 var(--accent)}
.day .dt{font-size:calc(12px*var(--fs));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.day h3{margin:0;font-size:calc(18px*var(--fs))}
.ev{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.ev .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:calc(14px*var(--fs))}
.ev p{margin:0;font-size:calc(14.5px*var(--fs))}
.ev .w{color:var(--muted);font-size:calc(13.5px*var(--fs))}
.ev .lk{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:calc(13.5px*var(--fs));margin-top:2px}
.lk{display:flex;flex-wrap:wrap;gap:4px 14px}
.lk a,.lk button{color:var(--accent);font-weight:600;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
.lk a:hover,.lk button:hover{text-decoration:underline}

/* info cards */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.ic{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ic.req{border-left:4px solid var(--accent)}
.ic .k{font-size:calc(11.5px*var(--fs));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ic.req .k{color:var(--accent)}
#depCards{max-width:820px}
.ic h3{margin:0;font-size:calc(17px*var(--fs))}
.ic p,.ic li{margin:0;font-size:calc(14.5px*var(--fs));color:var(--muted)}
.ic b{color:var(--ink)}
.ic ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.btn{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:calc(14px*var(--fs));text-decoration:none;margin-top:4px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.emerg{display:flex;flex-wrap:wrap;gap:10px}
.emerg div{background:var(--soft);border-radius:10px;padding:8px 12px;min-width:120px}
.emerg b{display:block;font-size:calc(22px*var(--fs));font-variant-numeric:tabular-nums;color:var(--accent)}
.emerg span{font-size:calc(13px*var(--fs));color:var(--muted)}

/* places + map */
.ctl{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#viewSeg button{font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:calc(13.5px*var(--fs));cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.mapbox{position:sticky;top:calc(var(--tb,52px) + 8px);display:flex;flex-direction:column;gap:8px;min-width:0}
.mapbox iframe,.nvmap{width:100%;height:min(70vh,600px);min-height:340px;border:1px solid var(--line);border-radius:12px;background:var(--chip);display:block;box-sizing:border-box;overflow:hidden}
.mapbox iframe[hidden],.nvmap[hidden]{display:none}
.maphead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.maphead b{font-size:calc(14.5px*var(--fs));overflow:hidden;text-overflow:ellipsis}
.maphead a{font-size:calc(13.5px*var(--fs));font-weight:600;text-decoration:none;white-space:nowrap}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}.mapbox{position:static;order:-1}.mapbox iframe,.nvmap{height:52vh;min-height:300px}}
/* beyond seoul */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.bc{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:70px}
.bc.on{outline:2px solid var(--accent)}
.bc .r{font-size:calc(11.5px*var(--fs));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.bc h3{margin:0;font-size:calc(17px*var(--fs))}
.bc .how{font-size:calc(13.5px*var(--fs));font-weight:600}
.bc p{margin:0;font-size:calc(14px*var(--fs));color:var(--muted)}
.bc .tip{font-size:calc(13px*var(--fs));color:var(--ink);background:var(--soft);border-radius:6px;padding:6px 9px}
.bc .lk{margin-top:auto;padding-top:6px;font-size:calc(13px*var(--fs))}
/* korean food */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.fd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;overflow:hidden;display:flex;flex-direction:column;gap:5px}
.fd .ph{position:relative;margin:-13px -15px 6px;aspect-ratio:16/10;background:var(--soft)}
.fd .ph img{display:block;width:100%;height:100%;object-fit:cover}
.fd .ph a{position:absolute;right:0;bottom:0;max-width:100%;box-sizing:border-box;padding:1px 6px;font-size:10px;line-height:1.5;color:#fff;background:rgba(0,0,0,.55);border-top-left-radius:6px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fd .ph a:hover{text-decoration:underline}
.fd .hg{font-size:calc(22px*var(--fs));font-weight:700;line-height:1.2;color:var(--accent);font-family:"Noto Sans KR",var(--body)}
.fd h3{margin:0;font-size:calc(16px*var(--fs))}
.fd p{margin:0;font-size:calc(13.5px*var(--fs));color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tag{font-size:calc(11.5px*var(--fs));font-weight:700;border-radius:999px;padding:1px 9px;background:var(--chip);color:var(--muted)}
.tag.hot{background:var(--soft);color:var(--accent)}
.tag.veg{color:var(--c28)}
.sub2{font-family:var(--display);font-size:calc(20px*var(--fs));margin:14px 0 0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}
.rs{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c14);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:5px}
.rs .cz{font-size:calc(11.5px*var(--fs));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c14)}
.rs h3{margin:0;font-size:calc(16.5px*var(--fs))}
.rs .ko{font-size:calc(13px*var(--fs));color:var(--muted)}
.rs p{margin:0;font-size:calc(13.5px*var(--fs));color:var(--muted)}
.rs .meta{font-size:calc(13px*var(--fs));color:var(--ink)}
.rs .mich{font-size:calc(12px*var(--fs));font-weight:700;color:var(--accent)}
.rs .lk{margin-top:auto;padding-top:6px;font-size:calc(13px*var(--fs))}
/* world heritage */
.hlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px;align-items:start}
.hp{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.hp.nat{border-top-color:var(--c28)}
.hp .r{font-size:calc(11.5px*var(--fs));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.hp.nat .r{color:var(--c28)}
.hp .dsc{margin:0 0 4px;font-size:calc(13.5px*var(--fs));color:var(--muted)}
.hp .cnt{font-size:calc(12px*var(--fs));font-weight:700;color:var(--muted);margin-top:2px}
.hp h3{margin:0;font-size:calc(16.5px*var(--fs));line-height:1.35}
.hp h3 .y{font-weight:600;color:var(--muted);font-size:calc(13px*var(--fs))}
.hp h3 .ty{font-size:calc(11px*var(--fs));font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;background:var(--chip);color:var(--muted)}
.hp h3 .ty.n{color:var(--c28)}
.hs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.hs li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px}
.hs li:hover{background:var(--chip)}
.hp{cursor:pointer}
.hp.on{outline:2px solid var(--accent)}
.hs li.on{background:var(--soft)}
.hs li.on .nm{color:var(--accent)}
.hs .nm{font-weight:600;font-size:calc(14.5px*var(--fs))}
.hs .ko{font-size:calc(12.5px*var(--fs));color:var(--muted);margin-left:6px}
.hs .pr{font-size:calc(12.5px*var(--fs));font-weight:600;color:var(--gold)}
.hs .ar{font-size:calc(12.5px*var(--fs));color:var(--muted)}
.hs .km{font-size:calc(12.5px*var(--fs));color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hs .lk{grid-column:1/-1;font-size:calc(12.5px*var(--fs));gap:2px 12px}
.hs .hw{font-size:calc(12.5px*var(--fs));color:var(--ink);margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;scroll-margin-top:70px}
.card.on{outline:2px solid var(--accent)}
.card[data-i],.bc[data-b]{cursor:pointer}
.card[data-i]:hover,.bc[data-b]:hover{border-color:var(--accent)}
.bc .km{font-size:calc(13px*var(--fs));color:var(--muted)}
.maphead .lk{gap:2px 12px;font-size:calc(13.5px*var(--fs))}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--chip)}
.dist{position:absolute;left:10px;bottom:10px;background:var(--surface);color:var(--ink);font-size:calc(12px*var(--fs));font-weight:700;border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:calc(11.5px*var(--fs));font-weight:700;color:var(--c)}
.card h3{font-size:calc(15.5px*var(--fs));margin:0;line-height:1.35}
.card p{margin:0;font-size:calc(13.5px*var(--fs));color:var(--muted)}
.card .lk{margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:calc(13px*var(--fs))}
.empty{color:var(--muted)}
footer{border-top:1px solid var(--line);padding-top:20px;font-size:calc(12.5px*var(--fs));color:var(--muted);display:flex;flex-direction:column;gap:6px}
footer p{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="pill" id="fsz" role="group" aria-label="Text size">
      <button type="button" data-fs="1" aria-pressed="true" style="font-size:12px" title="Text size: normal">A</button>
      <button type="button" data-fs="1.15" aria-pressed="false" style="font-size:15px" title="Text size: large">A</button>
      <button type="button" data-fs="1.3" aria-pressed="false" style="font-size:18px" title="Text size: extra large">A</button>
    </div>
    <div class="pill" id="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
      <button type="button" data-lang="ko" aria-pressed="false" lang="ko">한국어</button>
    </div>
  </div>

  <header>
    <div class="hero">
      <img class="logo" src="turespana-logo.jpg" alt="España — Turespaña" width="112" height="124">
      <div>
        <div class="eyebrow" data-t="greet"></div>
        <h1>Spain Travel Market 2026 in Seoul</h1>
        <div class="sub" data-t="sub"></div>
      </div>
    </div>
    <div class="hotelbox">
      <div class="k" data-t="hotelK"></div>
      <div class="row"><b id="hName"></b><select id="hotelSel" hidden aria-label="Hotel"></select></div>
      <div id="hAddr"></div>
      <div class="lk" id="hLinks"></div>
      <p class="note" data-t="hotelNote"></p>
    </div>
  </header>

  <div class="topbar" id="topbar">
  <div class="ctl" id="todoCtl" hidden>
    <div class="seg" id="viewSeg" role="group"></div>
    <div class="seg" id="catSeg" role="group"></div>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#schedule" data-t="nSched"></a>
    <a href="#before" data-t="nBefore"></a>
    <a href="#around" data-t="nAround"></a>
    <a href="#good" data-t="nGood"></a>
    <a href="#food" data-t="nFood"></a>
    <a href="#dep" data-t="nDep"></a>
    <a href="#todo" data-t="nTodo"></a>
    <a href="#beyond" data-t="nBeyond"></a>
    <a href="#heritage" data-t="nHer"></a>
  </nav>
  </div>

  <section id="schedule">
    <h2 data-t="nSched"></h2>
    <div class="days" id="days"></div>
    <p class="note" data-t="schedNote"></p>
  </section>

  <section id="before">
    <h2 data-t="nBefore"></h2>
    <div class="info" id="beforeCards"></div>
  </section>

  <section id="around">
    <h2 data-t="nAround"></h2>
    <div class="info" id="aroundCards"></div>
  </section>

  <section id="good">
    <h2 data-t="nGood"></h2>
    <div class="info" id="goodCards"></div>
  </section>

  <section id="food">
    <h2 data-t="nFood"></h2>
    <p class="lead" data-t="foodLead"></p>
    <div class="info" id="foodTips"></div>
    <h3 class="sub2" data-t="spotsH"></h3>
    <div class="info" id="foodSpots"></div>

ved at every celebration."],"es":["Japchae","Fideos transparentes de boniato salteados con verduras, ternera y aceite de sésamo. Plato festivo de todas las celebraciones."],"kr":["Japchae","고구마 전분 당면을 채소·소고기와 함께 참기름에 볶는다. 잔칫상에 빠지지 않는 음식."]},{"g":"rice","ko":"짜장면","s":0,"v":false,"en":["Jjajangmyeon","Noodles in a thick black-bean sauce with pork and onion — Korean-Chinese comfort food, often ordered with sweet-and-sour pork (tangsuyuk)."],"es":["Jjajangmyeon","Fideos con salsa espesa de soja negra, cerdo y cebolla: comida chino-coreana muy popular, a menudo con cerdo agridulce (tangsuyuk)."],"kr":["Jjajangmyeon","돼지고기·양파를 넣은 걸쭉한 춘장 소스 면 — 한국식 중화요리의 대표. 흔히 탕수육과 함께 시킨다."]},{"g":"soup","ko":"김치찌개","s":2,"v":false,"en":["Kimchi-jjigae","A bubbling stew of aged kimchi with pork and tofu — the taste of home for most Koreans."],"es":["Kimchi-jjigae","Guiso burbujeante de kimchi fermentado con cerdo y tofu: el sabor de casa para la mayoría de los coreanos."],"kr":["Kimchi-jjigae","잘 익은 김치에 돼지고기와 두부를 넣고 보글보글 끓인 찌개 — 대부분의 한국인에게 '집밥'의 맛."]},{"g":"soup","ko":"된장찌개","s":1,"v":"opt","en":["Doenjang-jjigae","Fermented soybean-paste stew with tofu, courgette and mushrooms. Earthy, savoury and served with almost every set meal."],"es":["Doenjang-jjigae","Guiso de pasta de soja fermentada con tofu, calabacín y setas. Terroso y sabroso; acompaña casi cualquier menú."],"kr":["Doenjang-jjigae","된장에 두부·애호박·버섯을 넣은 찌개. 구수하고 깊은 맛으로 거의 모든 백반에 나온다."]},{"g":"soup","ko":"순두부찌개","s":2,"v":"opt","en":["Sundubu-jjigae","Silky soft tofu in a spicy broth with seafood or meat; crack a raw egg in while it's still boiling."],"es":["Sundubu-jjigae","Tofu sedoso en caldo picante con marisco o carne; se casca un huevo crudo mientras aún hierve."],"kr":["Sundubu-jjigae","부드러운 순두부를 해물이나 고기와 함께 매운 국물에 끓인다. 끓을 때 날달걀을 깨 넣는다."]},{"g":"soup","ko":"삼계탕","s":0,"v":false,"en":["Samgyetang","A whole young chicken stuffed with sticky rice, ginseng, jujube and garlic, simmered in a clear broth."],"es":["Samgyetang","Pollo joven entero relleno de arroz glutinoso, ginseng, azufaifa y ajo, cocido en un caldo claro."],"kr":["Samgyetang","어린 닭 한 마리에 찹쌀·인삼·대추·마늘을 넣고 맑은 국물에 고아 낸다."]},{"g":"soup","ko":"설렁탕","s":0,"v":false,"en":["Seolleongtang","Milky ox-bone soup simmered for hours, served with rice and noodles. Season it yourself with salt and green onion."],"es":["Seolleongtang","Sopa blanca de hueso de buey cocida durante horas, con arroz y fideos. Se sazona al gusto con sal y cebolleta."],"kr":["Seolleongtang","소뼈를 오래 고아 뽀얀 국물에 밥과 소면을 말아 먹는다. 소금과 파로 직접 간을 한다."]},{"g":"soup","ko":"감자탕","s":2,"v":false,"en":["Gamjatang","Hearty pork-spine stew with potatoes, perilla leaves and perilla seeds. A popular late-night dish to share."],"es":["Gamjatang","Contundente guiso de espinazo de cerdo con patatas, hojas y semillas de perilla. Muy popular para compartir de noche."],"kr":["Gamjatang","돼지 등뼈에 감자·깻잎·들깨를 넣어 푸짐하게 끓인 탕. 밤늦게 나눠 먹는 인기 메뉴."]},{"g":"soup","ko":"닭한마리","s":0,"v":false,"en":["Dakhanmari","'One whole chicken' boiled at the table with potatoes and rice cakes, dipped in a mustard-soy sauce; noodles go in at the end. The famous Dakhanmari Alley is right next to the JW Marriott Dongdaemun."],"es":["Dakhanmari","'Un pollo entero' cocido en la mesa con patatas y pastelitos de arroz, que se moja en salsa de mostaza y soja; al final se añaden fideos. El famoso callejón del Dakhanmari está junto al JW Marriott Dongdaemun."],"kr":["Dakhanmari","'닭 한 마리'를 감자·떡과 함께 식탁에서 끓여 겨자간장에 찍어 먹고, 마지막에 칼국수를 넣는다. JW 메리어트 동대문 바로 옆에 유명한 닭한마리 골목이 있다."]},{"g":"share","ko":"김치·반찬","s":1,"v":"opt","en":["Kimchi & banchan","Kimchi and the small side dishes (banchan) that come free with every meal — and are refilled free if you ask."],"es":["Kimchi y banchan","El kimchi y los pequeños acompañamientos (banchan) que se sirven gratis con cada comida, y se rellenan gratis si los pide."],"kr":["Kimchi & banchan","모든 식사에 무료로 나오는 김치와 작은 반찬들 — 더 달라고 하면 무료로 다시 채워 준다."]},{"g":"share","ko":"보쌈","s":0,"v":false,"en":["Bossam","Tender boiled pork belly sliced and wrapped with fresh kimchi, salted shrimp and cabbage leaves."],"es":["Bossam","Panceta de cerdo cocida y tierna, en lonchas, que se envuelve con kimchi fresco, gamba salada y hojas de col."],"kr":["Bossam","부드럽게 삶은 돼지고기를 썰어 생김치·새우젓·배춧잎과 함께 싸 먹는다."]},{"g":"share","ko":"족발","s":0,"v":false,"en":["Jokbal","Pig's trotters braised in soy sauce and spices, served sliced — gelatinous, rich and a favourite with beer or soju."],"es":["Jokbal","Manitas de cerdo estofadas en soja y especias, servidas en lonchas: melosas, sabrosas y perfectas con cerveza o soju."],"kr":["Jokbal","돼지 족을 간장과 향신료에 조려 썰어 낸다 — 쫀득하고 진한 맛으로 맥주나 소주와 잘 어울린다."]},{"g":"share","ko":"빈대떡","s":0,"v":"opt","en":["Bindaetteok","Crispy mung-bean pancakes fried in front of you at Gwangjang Market, 10 minutes' walk from the hotel. Perfect with makgeolli."],"es":["Bindaetteok","Tortitas crujientes de judía mungo que se fríen al momento en el mercado de Gwangjang, a 10 minutos a pie del hotel. Perfectas con makgeolli."],"kr":["Bindaetteok","광장시장에서 바로 부쳐 주는 바삭한 녹두전. 호텔에서 걸어서 10분, 막걸리와 찰떡궁합."]},{"g":"share","ko":"해물파전","s":0,"v":false,"en":["Haemul pajeon","A savoury pancake loaded with green onion and seafood. Koreans crave it with makgeolli on rainy days."],"es":["Haemul pajeon","Tortita salada con cebolleta y marisco. Los coreanos la piden con makgeolli en los días de lluvia."],"kr":["Haemul pajeon","파와 해물을 듬뿍 넣은 부침개. 비 오는 날 막걸리와 함께 생각나는 음식."]},{"g":"share","ko":"육회","s":0,"v":false,"en":["Yukhoe","Korean beef tartare with pear, sesame oil and a raw egg yolk. Gwangjang Market's 'yukhoe alley' is the place to try it."],"es":["Yukhoe","Tartar de ternera coreano con pera, aceite de sésamo y yema de huevo. El 'callejón del yukhoe' del mercado de Gwangjang es el lugar para probarlo."],"kr":["Yukhoe","배·참기름·노른자를 곁들인 한국식 소고기 생고기 요리. 광장시장 '육회 골목'에서 맛보세요."]},{"g":"share","ko":"간장게장","s":0,"v":false,"en":["Ganjang-gejang","Raw crab marinated in soy sauce — nicknamed the 'rice thief'. Mix the rice into the shell."],"es":["Ganjang-gejang","Cangrejo crudo marinado en soja, apodado 'ladrón de arroz'. Mezcle el arroz dentro del caparazón."],"kr":["Ganjang-gejang","간장에 숙성시킨 생게 — '밥도둑'이라는 별명. 게딱지에 밥을 비벼 먹는다."]},{"g":"street","ko":"떡볶이","s":2,"v":"opt","en":["Tteokbokki","Chewy rice cakes in a sweet-spicy red sauce, often with fish cakes and boiled egg. Korea's number one street snack."],"es":["Tteokbokki","Pastelitos de arroz en salsa roja dulce y picante, a menudo con pastel de pescado y huevo cocido. El aperitivo callejero número uno."],"kr":["Tteokbokki","쫄깃한 떡을 달고 매운 빨간 양념에 어묵·삶은 달걀과 함께. 한국 길거리 간식 1위."]},{"g":"street","ko":"만두","s":0,"v":"opt","en":["Mandu","Korean dumplings filled with pork, kimchi or vegetables — steamed, pan-fried or in soup."],"es":["Mandu","Empanadillas coreanas de cerdo, kimchi o verduras: al vapor, a la plancha o en sopa."],"kr":["Mandu","돼지고기·김치·채소로 속을 채운 한국식 만두 — 찐만두, 군만두, 만둣국."]},{"g":"street","ko":"팥빙수","s":0,"v":true,"en":["Bingsu","Fluffy shaved milk ice with sweet red beans, rice cakes or fruit. A dessert cafés serve all year round."],"es":["Bingsu","Hielo de leche raspado y esponjoso con judía roja dulce, pastelitos de arroz o fruta. Un postre de cafetería todo el año."],"kr":["Bingsu","곱게 간 우유 얼음에 단팥·떡·과일을 얹은 디저트. 카페에서 사계절 판다."]}];

const FOOD_TIPS = {"en":[["How to order","Barbecue places usually serve a minimum of two portions per table. Many restaurants have a call button on the table; you pay at the counter when you leave. Tipping is not expected."],["Not too spicy, please","Say <b>“an maepge juseyo”</b> (안 맵게 주세요) for “not spicy, please”. Dishes tagged “Spicy” below range from ●○○ (mild) to ●●● (hot)."],["Vegetarian?","Many soups and kimchi use fish sauce, anchovy or meat broth. Temple-food restaurants and bibimbap without meat are the easiest choices. Say <b>“gogi ppaejuseyo”</b> (고기 빼주세요) for “no meat, please”."],["Drinks","<b>Soju</b> (clear spirit, about 16–17%), <b>makgeolli</b> (cloudy rice wine) and Korean beer; mixing soju and beer is called <b>somaek</b>. Pour for others, not for yourself."]],"es":[["Cómo pedir","En las barbacoas suelen pedir un mínimo de dos raciones por mesa. Muchos restaurantes tienen un botón de llamada en la mesa; se paga en la caja al salir. No se deja propina."],["Poco picante, por favor","Diga <b>«an maepge juseyo»</b> (안 맵게 주세요) para pedir «sin picante, por favor». Los platos marcados abajo como «Picante» van de ●○○ (suave) a ●●● (muy picante)."],["¿Vegetariano?","Muchas sopas y el kimchi llevan salsa de pescado, anchoa o caldo de carne. Los restaurantes de comida de templo y el bibimbap sin carne son lo más fácil. Diga <b>«gogi ppaejuseyo»</b> (고기 빼주세요) para «sin carne, por favor»."],["Bebidas","<b>Soju</b> (destilado transparente, unos 16–17 %), <b>makgeolli</b> (vino de arroz turbio) y cerveza coreana; mezclar soju y cerveza se llama <b>somaek</b>. Se sirve a los demás, no a uno mismo."]],"kr":[["주문하는 법","고깃집은 보통 한 테이블에 2인분 이상 주문해야 합니다. 식탁에 호출 벨이 있는 식당이 많고, 계산은 나갈 때 카운터에서 합니다. 팁은 주지 않습니다."],["덜 맵게","<b>“안 맵게 주세요”</b>라고 말하세요. 아래 ‘매운맛’ 표시는 ●○○(약간)부터 ●●●(아주 매움)까지입니다."],["채식이라면","국·찌개와 김치에는 젓갈·멸치·고기 육수가 들어가는 경우가 많습니다. 사찰음식점과 고기를 뺀 비빔밥이 가장 쉬운 선택입니다. <b>“고기 빼주세요”</b>라고 말하세요."],["술","<b>소주</b>(약 16–17도), <b>막걸리</b>(탁한 쌀 술), 한국 맥주. 소주와 맥주를 섞으면 <b>소맥</b>. 내 잔은 스스로 채우지 않고 서로 따라 줍니다."]]};

our","en":"Fresh handmade pasta with views over Namsan from the terrace. Open daily.","es":"Pasta fresca hecha a mano con vistas al Namsan desde la terraza. Abre todos los días.","kr":"테라스에서 남산이 보이는 생면 파스타. 매일 영업.","kra":"해방촌 · 녹사평역(6호선)"},{"c":"it","name":"Borgo Hannam","ko":"보르고 한남","area":"Hannam-dong","station":"Hangangjin Stn (Line 6)","price":"₩₩₩","mich":"MICHELIN Guide 2026","q":"보르고 한남","url":"https://guide.michelin.com/kr/en/seoul-capital-area/kr-seoul/restaurant/borgo-hannam","en":"An Italian chef's trattoria: house-made bread, pasta and desserts, and a spicy Tuscan fish soup (caldaro). Dinner only.","es":"La trattoria de un chef italiano: pan, pasta y postres caseros, y una sopa toscana de pescado picante (caldaro). Solo cenas.","kr":"이탈리아 셰프의 트라토리아: 직접 만든 빵·파스타·디저트와 매콤한 토스카나 생선 수프(칼다로). 저녁만.","kra":"한남동 · 한강진역(6호선)"},{"c":"it","name":"Trattoria Romagna","ko":"뜨라또리아 로마냐","area":"Banpo (Seocho)","station":"Sinbanpo Stn (Line 9)","price":"₩₩₩₩","mich":"MICHELIN Guide 2026","q":"뜨라또리아 로마냐 반포","url":"https://guide.michelin.com/kr/en/seoul-capital-area/kr-seoul/restaurant/trattoria-romagna","en":"Special-occasion Italian run by two siblings: truffle arancini, risotto and vongole with fresh pasta. Closed Sundays.","es":"Italiano para una ocasión especial, llevado por dos hermanos: arancini de trufa, risotto y vongole con pasta fresca. Cierra los domingos.","kr":"남매가 운영하는 특별한 날의 이탈리안: 트러플 아란치니, 리소토, 생면 봉골레. 일요일 휴무.","kra":"반포(서초) · 신반포역(9호선)"},{"c":"in","name":"Everest","ko":"에베레스트 (창신동 본점)","area":"Changsin-dong (near Dongdaemun)","station":"Dongdaemun Stn (Line 1/4), Exit 3","price":"₩","mich":"","q":"에베레스트 창신동","url":"https://www.timeout.com/seoul/restaurants/everest","en":"Long-running Nepali-Indian favourite within walking distance of the hotel: curries, butter naan, tandoori chicken and momo.","es":"Clásico nepalí-indio de toda la vida, a poca distancia a pie del hotel: curris, naan de mantequilla, pollo tandoori y momo.","kr":"호텔에서 걸어갈 수 있는 오래된 네팔·인도 식당: 커리, 버터 난, 탄두리 치킨, 모모.","kra":"창신동(동대문 근처) · 동대문역(1·4호선) 3번 출구"},{"c":"in","name":"Taj","ko":"타지 명동","area":"Myeongdong","station":"Euljiro 1-ga Stn (Line 2)","price":"₩₩","mich":"","q":"타지 명동 인도","url":"https://english.visitseoul.net/restaurants/Taj1/ENP013151","en":"North Indian cooking by an Indian chef — tandoori dishes and curries, each in vegetarian and non-vegetarian versions. Closed Mondays.","es":"Cocina del norte de la India de un chef indio: tandoori y curris, en versión vegetariana y no vegetariana. Cierra los lunes.","kr":"인도인 셰프의 북인도 요리 — 탄두리와 커리를 채식·비채식으로. 월요일 휴무.","kra":"명동 · 을지로입구역(2호선)"},{"c":"es","name":"Visca","ko":"비스카","area":"Seochon / Buam-dong","station":"Gyeongbokgung Stn (Line 3), then bus","price":"₩₩","mich":"MICHELIN Guide 2026","q":"비스카 부암동","url":"https://guide.michelin.com/kr/en/seoul-capital-area/kr-seoul/restaurant/visca","en":"Spanish cooking by a Spain-trained chef, pairing imported Spanish products with Korean ingredients — see how Korea interprets your cuisine.","es":"Cocina española de un chef formado en España, que combina productos españoles con ingredientes coreanos: vea cómo Corea interpreta su cocina.","kr":"스페인에서 배운 셰프가 스페인 식재료와 한국 식재료를 함께 쓰는 스페인 요리 — 한국이 스페인 요리를 어떻게 해석하는지 볼 수 있다.","kra":"서촌·부암동 · 경복궁역(3호선)에서 버스"},{"c":"es","name":"Tapa Madre","ko":"따빠마드레","area":"Gyeonghuigung / Gwanghwamun","station":"Gwanghwamun Stn (Line 5)","price":"₩₩–₩₩₩","mich":"Restaurants from Spain (ICEX)","q":"따빠마드레 경희궁","url":"https://www.asiae.co.kr/en/article/2023062613182938959","en":"Tapas, pintxos, paella, pulpo, jamón and gambas al ajillo — the first Seoul restaurant certified 'Restaurants from Spain' by ICEX.","es":"Tapas, pintxos, paella, pulpo, jamón y gambas al ajillo: el primer restaurante de Seúl con la certificación 'Restaurants from Spain' del ICEX.","kr":"타파스, 핀초스, 파에야, 문어, 하몽, 감바스 알 아히요 — ICEX 'Restaurants from Spain' 인증을 받은 서울 첫 식당.","kra":"경희궁·광화문 · 광화문역(5호선)"}];

, Gyeongju","en":{"n":"Gyeongju","r":"Ancient Silla capital · 1–2 days · UNESCO","how":"About 2 h by KTX to Singyeongju Station","p":"An open-air museum: Bulguksa Temple and Seokguram Grotto, the royal tumuli of Daereungwon and Donggung Palace & Wolji Pond, beautiful when lit at night.","tip":"Easy to pair with Busan (about 30 min apart by KTX)."},"es":{"n":"Gyeongju","r":"Antigua capital de Silla · 1–2 días · UNESCO","how":"Aprox. 2 h en KTX hasta la estación de Singyeongju","p":"Un museo al aire libre: el templo Bulguksa y la gruta de Seokguram, los túmulos reales de Daereungwon y el palacio Donggung con el estanque Wolji, precioso iluminado de noche.","tip":"Fácil de combinar con Busan (unos 30 min en KTX)."},"kr":{"n":"경주","r":"신라의 옛 수도 · 1–2일 · 유네스코","how":"KTX로 신경주역까지 약 2시간","p":"지붕 없는 박물관: 불국사와 석굴암, 대릉원 고분, 밤 조명이 아름다운 동궁과 월지.","tip":"부산과 묶기 쉽다(KTX로 약 30분)."}},{"id":"jeonju","lat":35.815,"lng":127.153,"z":14,"q":"Jeonju Hanok Village","en":{"n":"Jeonju Hanok Village","r":"Jeollabuk-do · day trip or overnight","how":"About 1 h 40 min by KTX from Yongsan Station","p":"Over 700 traditional hanok houses, the birthplace of bibimbap and a capital of Korean food — perfect for food lovers.","tip":"Stay a night in a hanok guesthouse."},"es":{"n":"Aldea Hanok de Jeonju","r":"Jeollabuk-do · un día o una noche","how":"Aprox. 1 h 40 min en KTX desde la estación de Yongsan","p":"Más de 700 casas tradicionales hanok, la cuna del bibimbap y una capital de la gastronomía coreana: ideal para amantes de la comida.","tip":"Duerma una noche en una casa hanok."},"kr":{"n":"전주 한옥마을","r":"전북 · 당일 또는 1박","how":"용산역에서 KTX로 약 1시간 40분","p":"700채가 넘는 한옥, 비빔밥의 고향이자 한국 음식의 수도 — 미식가에게 딱 맞는 곳.","tip":"한옥 게스트하우스에서 하룻밤 묵어 보세요."}},{"id":"mokpo","lat":34.7908,"lng":126.386,"z":12,"q":"Mokpo Station","en":{"n":"Mokpo","r":"South-west coast · 1–2 days","how":"About 2 h 30 min by KTX from Yongsan Station to Mokpo Station","p":"A port city at the end of the Honam line: the Mokpo Marine Cable Car over   before:[
    {req:true,k:"Required",h:"Korea e-Arrival Card",p:"All foreign visitors must submit Korea's e-Arrival Card online <b>within 3 days before arrival</b>. It is free. Have your passport and flight number ready, and use your hotel address above.",btn:["Fill out the e-Arrival Card ↗","https://www.e-arrivalcard.go.kr/"],note:"Use only the official government site (e-arrivalcard.go.kr). Sites that charge a fee are not official."},

    {k:"Weather",h:"Pack for cold weather",p:"Late November in Seoul is usually around <b>5–10 °C by day</b> and <b>near or below 0 °C</b> in the morning and at night, dry and often windy. Bring a warm coat, scarf and gloves."},

  around:[

    {k:"Transport card",h:"T-money card",p:"Buy and top up a <b>T-money</b> card with cash at convenience stores (GS25, CU, 7-Eleven) or subway stations. Tap in and out on the subway and buses; many taxis accept it too."},
    {k:"Taxis",h:"Taxis",p:"Taxis are plentiful and accept cards. The <b>Kakao T</b> app (English, accepts foreign cards) and <b>Uber</b> both work in Seoul. Show the driver the address in Korean — each place below has it on NAVER Map."},
    {k:"Apps",h:"Maps & translation",p:"Google Maps shows public transport in Korea, but walking and driving directions are limited. <b>NAVER Map</b> (set it to English: MY › Settings › Language) is more accurate. <b>Papago</b> is the best translation app for Korean.",links:[["NAVER Map — iPhone ↗","https://apps.apple.com/app/id311867728"],["Android ↗","https://play.google.com/store/apps/details?id=com.nhn.android.nmap"]]}

    {k:"Shopping",h:"Tax refund",p:"In shops marked <b>“Tax Free”</b>, show your passport to get the tax back — many stores refund it on the spot. Tipping is not expected in Korea."},

  dep:[{k:"Departure · Incheon (ICN)",h:"ICN Smart Pass — faster departure",p:"Flying home from <b>Incheon Airport</b>? Register once in the free <b>ICN SmartPass</b> app and go from the departure entrance to your boarding gate with <b>face recognition</b> instead of showing your passport and boarding pass at each step.",list:["<b>1.</b> Scan your passport (avoid glare) — an e-passport is needed","<b>2.</b> Register your face in the app","<b>3.</b> Add your boarding pass: mobile QR code or paper barcode (skipped if it is added automatically)","No app? Register at a self check-in kiosk at the airport.","Still carry your passport and boarding pass — not in checked baggage. Ages 7+; under-14s need a guardian's consent. Face data is kept for 5 years."],links:[["App Store ↗","https://apps.apple.com/kr/app/icn-smartpass-%EC%9D%B8%EC%B2%9C%EA%B3%B5%ED%95%AD-%EC%8A%A4%EB%A7%88%ED%8A%B8%ED%8C%A8%EC%8A%A4/id6443837919"],["Google Play ↗","https://play.google.com/store/apps/details?id=kr.airport.android.smartpass"],["How it works (Incheon Airport) ↗","https://sps-mapi.airport.kr:8420/resources/html/info_smartpass.html"]]}],

rante presenta los platos a su manera.", spicy:"Picante", veg:"Vegetariano", vegOpt:"Opción vegetariana", nBeyond:"Más allá de Seúl", beyondLead:"¿Le quedan días en Corea? Estos son los destinos que más recomiendan las guías de viaje en español: historia, patrimonio de la UNESCO, gastronomía y naturaleza, todos accesibles desde Seúl en tren o con un vuelo corto. Pulse un destino para ver la distancia y la ruta en KTX, autobús o avión desde Seúl.", bmapNote:"Los tiempos del mapa son estimaciones de transporte público de Google. NAVER Map (en inglés) también muestra trenes KTX, autobuses exprés y vuelos; billetes de KTX: letskorail.com.", beyondNote:"Selección basada en los destinos más recomendados en las guías de viaje sobre Corea en español. Los tiempos de viaje son aproximados; consulte los horarios (Korail: letskorail.com) antes de salir.",

  before:[
    {req:true,k:"Obligatorio",h:"Tarjeta de llegada electrónica (e-Arrival Card)",p:"Todos los visitantes extranjeros deben presentar en línea la e-Arrival Card de Corea <b>en los 3 días anteriores a la llegada</b>. Es gratuita. Tenga a mano el pasaporte y el número de vuelo, y use la dirección de su hotel indicada arriba.",btn:["Rellenar la e-Arrival Card ↗","https://www.e-arrivalcard.go.kr/"],note:"Use solo la web oficial del gobierno (e-arrivalcard.go.kr). Las webs que cobran no son oficiales."},

    {k:"Tiempo",h:"Ropa de abrigo",p:"A finales de noviembre Seúl suele estar entre <b>5 y 10 °C durante el día</b> y <b>alrededor o por debajo de 0 °C</b> por la mañana y la noche, con aire seco y a menudo viento. Traiga abrigo, bufanda y guantes."},
    {k:"Para el B2B",h:"Lista para el día de reuniones",list:["Muchas tarjetas de visita: hasta 25 reuniones más networking","Folletos o un código QR con sus materiales digitales","Portátil o tableta cargados; vestimenta de negocios"]},

    {k:"Tarjeta de transporte",h:"Tarjeta T-money",p:"Compre y recargue una tarjeta <b>T-money</b> en efectivo en tiendas de conveniencia (GS25, CU, 7-Eleven) o estaciones de metro. Pásela al entrar y salir del metro y del autobús; muchos taxis también la aceptan."},
    {k:"Taxis",h:"Taxis",p:"Hay muchos taxis y aceptan tarjeta. La app <b>Kakao T</b> (en inglés, acepta tarjetas extranjeras) y <b>Uber</b> funcionan en Seúl. Muestre al conductor la dirección en coreano: cada lugar de abajo la tiene en NAVER Map."},
    {k:"Apps",h:"Mapas y traducción",p:"Google Maps muestra el transporte público en Corea, pero las rutas a pie y en coche son limitadas. <b>NAVER Map</b> (póngalo en inglés: MY › Settings › Language) es más preciso. <b>Papago</b> es la mejor app para traducir del coreano.",links:[["NAVER Map — iPhone ↗","https://apps.apple.com/app/id311867728"],["Android ↗","https://play.google.com/store/apps/details?id=com.nhn.android.nmap"]]}
  ],
  good:[
    {k:"Dinero",h:"Pagos",p:"La moneda es el <b>won coreano (KRW, ₩)</b>. Las tarjetas se aceptan casi en todas partes, también en taxis. Lleve algo de efectivo para comida callejera y mercados tradicionales; use los cajeros con el letrero <b>«Global»</b>."},
    {k:"Compras",h:"Devolución de impuestos",p:"En las tiendas con el letrero <b>«Tax Free»</b>, muestre su pasaporte para recuperar los impuestos; muchas tiendas los devuelven en el acto. En Corea no se suele dejar propina."},
    {k:"Teléfono",h:"Datos móviles",p:"Compre una <b>eSIM</b> antes de viajar o una tarjeta SIM en el aeropuerto. Hay wifi gratuito en hoteles, cafeterías, estaciones de metro y lugares públicos."},

  dep:[{k:"Salida · Incheon (ICN)",h:"ICN Smart Pass — salida más rápida",p:"¿Vuelve desde el <b>aeropuerto de Incheon</b>? Regístrese una vez en la app gratuita <b>ICN SmartPass</b> y pase desde la entrada de salidas hasta la puerta de embarque con <b>reconocimiento facial</b>, sin mostrar el pasaporte y la tarjeta de embarque en cada control.",list:["<b>1.</b> Escanee su pasaporte (evite reflejos); se necesita pasaporte electrónico","<b>2.</b> Registre su rostro en la app","<b>3.</b> Añada su tarjeta de embarque: código QR móvil o código de barras en papel (no es necesario si se añade automáticamente)","¿Sin app? Puede registrarse en un quiosco de autofacturación del aeropuerto.","Lleve igualmente el pasaporte y la tarjeta de embarque, no en el equipaje facturado. A partir de 7 años; menores de 14 necesitan consentimiento de un tutor. Los datos faciales se guardan 5 años."],links:[["App Store ↗","https://apps.apple.com/kr/app/icn-smartpass-%EC%9D%B8%EC%B2%9C%EA%B3%B5%ED%95%AD-%EC%8A%A4%EB%A7%88%ED%8A%B8%ED%8C%A8%EC%8A%A4/id6443837919"],["Google Play ↗","https://play.google.com/store/apps/details?id=kr.airport.android.smartpass"],["Cómo funciona (aeropuerto de Incheon) ↗","https://sps-mapi.airport.kr:8420/resources/html/info_smartpass.html"]]}],

const SEOUL_STN={en:"Seoul Station",kr:"서울역",lat:37.5547,lng:126.9707}, GMP_APT={en:"Gimpo Airport",kr:"김포공항",lat:37.5583,lng:126.7906};
/* zoom one step wider than "fit both points", so Google's directions panel (top-left) does not cover the route */
const JEJU_APT={lat:33.5066,lng:126.4929};
function fitZ(pa,pb,el){const W=(el&&el.clientWidth)||560,H=(el&&el.clientHeight)||420,my=l=>Math.log(Math.tan(Math.PI/4+l*Math.PI/360));
  const dx=Math.max(Math.abs(pa.lng-pb.lng)/360,1e-6),dy=Math.max(Math.abs(my(pa.lat)-my(pb.lat))/(2*Math.PI),1e-6);
  return Math.max(3,Math.min(16,Math.floor(Math.min(Math.log2(W/256/dx),Math.log2(H/256/dy)))-1))}
const gRouteEmbed=(a,b,air,pa,pb,el)=>"https://maps.google.com/maps?saddr="+enc(a)+"&daddr="+enc(b)+(air?"":"&dirflg=r")+(pa&&pb?"&z="+fitZ(pa,pb,el):"")+"&hl="+lang+"&output=embed";
const gRouteLink=(a,b,air)=>"https://www.google.com/maps/dir/?api=1&origin="+enc(a)+"&destination="+enc(b)+(air?"":"&travelmode=transit")+"&hl="+lang;
const nRouteLink=(s,d)=>"https://map.naver.com/p/directions/"+s.lng+","+s.lat+","+enc(s.en)+",,/"+d.lng+","+d.lat+","+enc(d.en)+",,/-/transit?lang="+nLang();
const ll=p=>p.lat+","+p.lng;
const routeLinks=(s,d,air)=>pair(`<a href="${air?gRouteLink("Gimpo International Airport","Jeju International Airport",true):gRouteLink(ll(s),ll(d))}" target="_blank" rel="noopener">${t().gRoute}</a>`,`<a href="${nRouteLink(s,d)}" target="_blank" rel="noopener">${t().nRoute}</a>`);

/* ── map provider ──
   Korean version: NAVER map when NAVER_KEY (NAVER Cloud Platform › Maps › Application, Web service URL = this site) is set;
   otherwise (and in EN/ES) the Google Maps embed. NAVER cannot be iframed (X-Frame-Options), so it needs the JS API. */
const NAVER_KEY="";
let nvFail=false,nvP=null;const NV={};
window.navermap_authFailure=()=>{nvFail=true;["map","bmap","hmap"].forEach(id=>{const f=$(id),d=$(id+"Nv");if(d)d.hidden=true;f.hidden=false;if(f.dataset.g)f.src=f.dataset.g})};
const useNaver=()=>isKo()&&NAVER_KEY&&!nvFail;
function nvLoad(){return nvP||(nvP=new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId="+NAVER_KEY+"&language=ko";sc.onload=()=>window.naver&&naver.maps?ok(naver):no();sc.onerror=no;document.head.appendChild(sc)}))}
/* spec: {a,b} two points (start→end, straight dashed line; real transit route via the NAVER link) | {p,z} one point | {c:[lat,lng],z} overview */
function setMap(id,gsrc,spec){const f=$(id);f.dataset.g=gsrc;let d=$(id+"Nv");
  if(!useNaver()){if(d)d.hidden=true;f.hidden=false;if(f.getAttribute("src")!==gsrc)f.src=gsrc;return}
  if(!d){d=document.createElement("div");d.id=id+"Nv";d.className="nvmap";f.after(d)}
  f.hidden=true;d.hidden=false;
  nvLoad().then(N=>{const M=N.maps;const m=NV[id]||(NV[id]=new M.Map(d,{zoomControl:true,zoomControlOptions:{position:M.Position.TOP_RIGHT}}));
    (NV[id+"o"]||[]).forEach(o=>o.setMap(null));const o=[],L=q=>new M.LatLng(q.lat,q.lng);
    if(spec.a&&spec.b){const A=L(spec.a),B=L(spec.b);
      o.push(new M.Marker({position:A,map:m,title:spec.a.n||""}),new M.Marker({position:B,map:m,title:spec.b.n||""}),
        new M.Polyline({map:m,path:[A,B],strokeColor:"#b3261e",strokeWeight:4,strokeOpacity:.8,strokeStyle:"shortdash"}));
      m.fitBounds(new M.LatLngBounds(L({lat:Math.min(spec.a.lat,spec.b.lat),lng:Math.min(spec.a.lng,spec.b.lng)}),L({lat:Math.max(spec.a.lat,spec.b.lat),lng:Math.max(spec.a.lng,spec.b.lng)})),{top:60,right:60,bottom:60,left:60})}
    else if(spec.p){const A=L(spec.p);o.push(new M.Marker({position:A,map:m}));m.setCenter(A);m.setZoom(spec.z||16)}
    else{m.setCenter(new M.LatLng(spec.c[0],spec.c[1]));m.setZoom(spec.z||7)}
    NV[id+"o"]=o}).catch(()=>{nvFail=true;d.hidden=true;f.hidden=false;f.src=gsrc})}

  ["chungnam",["충남","충청남도"],"Chungcheongnam-do","Chungcheong del Sur","충청남도"],["jeonbuk",["전북","전라북도","전북특별자치도"],"Jeollabuk-do","Jeolla del Norte","전북특별자치도"],
  ["jeonnam",["전남","전라남도"],"Jeollanam-do","Jeolla del Sur","전라남도"],["gyeongbuk",["경북","경상북도"],"Gyeongsangbuk-do","Gyeongsang del Norte","경상북도"],
  ["gyeongnam",["경남","경상남도"],"Gyeongsangnam-do","Gyeongsang del Sur","경상남도"],["ulsan",["울산"],"Ulsan","Ulsan","울산"],["jeju",["제주","제주특별자치도"],"Jeju-do","Jeju","제주도"]];
const hReg=h=>REG.find(r=>r[1].includes(h.addr.split(" ")[0]))||REG[0];
const regName=r=>isKo()?r[4]:lang==="es"?r[3]:r[2];
const hArea=h=>{if(!isKo())return h.area;const a=h.addr.split(" "),r=hReg(h)[0];return (r==="seoul"||r==="ulsan")?a[0]+" "+a[1]:a[1].replace(/(시|군)$/,"")};
const hCity=h=>isKo()?hArea(h).split(" ").pop():h.area.split(" · ")[0];
const hKm=h=>Math.round(hav(SEOUL_STN.lat,SEOUL_STN.lng,h.lat,h.lng));
let hView="year";try{if(localStorage.getItem("stmHView")==="region")hView="region"}catch(e){}
function hLi(h,i,withProp){const p=HER_PROPS.find(x=>x.id===h.p);
  return `<li data-h="${i}" tabindex="0"><div><span class="nm"${isKo()?' lang="ko"':""}>${esc(plName(h))}</span><span class="ko"${isKo()?"":' lang="ko"'}>${esc(isKo()?h.en:h.ko)}</span>${withProp?`<div class="pr">${esc(p[DL()])} · ${p.y}</div>`:""}<div class="ar">${esc(hArea(h))}</div><div class="hw">${esc(h.how[DL()])}</div></div><div class="km">≈ ${hKm(h)} km</div><div class="lk">${hLinks(h)}</div></li>`}
function renderHeritage(){
  $("herLead").textContent=t().herLead(HER_PROPS.length,HERITAGE.length);
  $("herSeg").innerHTML=[["year",t().hvYear],["region",t().hvRegion]].map(([k,n])=>`<button type="button" data-hv="${k}" aria-pressed="${k===hView}">${n}</button>`).join("");
  const all=HERITAGE.map((h,i)=>[h,i]);
  $("herList").innerHTML=hView==="region"
   ?REG.map(r=>{const list=all.filter(([h])=>hReg(h)===r).sort((a,b)=>hKm(a[0])-hKm(b[0]));if(!list.length)return "";
      const cities=[...new Set(list.map(([h])=>hCity(h)))].join(" · ");
      return `<article class="hp reg"><div class="r">${esc(cities)}</div><h3>${regName(r)}</h3><div class="cnt">${t().herCnt(list.length)}</div><ul class="hs">${list.map(([h,i])=>hLi(h,i,true)).join("")}</ul></article>`}).join("")
   :HER_PROPS.map(p=>{const list=all.filter(([h])=>h.p===p.id);
      const areas=[...new Set(list.map(([h])=>hCity(h)))].slice(0,4).join(" · ");
      return `<article class="hp${p.t==="n"?" nat":""}"><div class="r">${p.y} · ${p.t==="n"?t().natural:t().cultural} · ${esc(areas)}</div><h3>${p[DL()]}</h3><p class="dsc">${p.d[DL()]}</p>
      <div class="cnt">${t().herCnt(list.length)}</div><ul class="hs">${list.map(([h,i])=>hLi(h,i,false)).join("")}</ul></article>`}).join("");
  if(hSel)hShow(hSel,false);else{setMap("hmap","https://maps.google.com/maps?ll=35.9,127.6&z=7&hl="+lang+"&output=embed",{c:[35.9,127.8],z:7});$("hmapName").textContent=t().herMapHint;$("hmapLinks").innerHTML=""}}
$("herSeg").addEventListener("click",e=>{const b=e.target.closest("button[data-hv]");if(!b)return;hView=b.dataset.hv;try{localStorage.setItem("stmHView",hView)}catch(x){}renderHeritage();
  const y=$("heritage").getBoundingClientRect().top+scrollY-$("topbar").offsetHeight-8;if(scrollY>y+200)scrollTo({top:y})});
function pickH(e){const card=e.target.closest(".hp");if(!card||e.target.closest("a"))return;const li=e.target.closest("li[data-h]")||card.querySelector("li[data-h]");if(!li)return;if(e.type==="keydown"){if(e.key!=="Enter"&&e.key!==" ")return;e.preventDefault()}
  hShow(HERITAGE[+li.dataset.h],matchMedia("(max-width:860px)").matches)}
$("herList").addEventListener("click",pickH);$("herList").addEventListener("keydown",pickH);
const secs=["schedule","before","around","good","food","dep","todo","beyond","heritage"];
/* sticky top bar: the nearby sort/category rows sit above the menu tabs while "Things to do nearby" is on screen */
function syncTopbar(){const r=$("todo").getBoundingClientRect(),c=$("todoCtl"),tb=$("topbar");
  const show=r.top<innerHeight*0.5&&r.bottom>tb.offsetHeight+160;if(c.hidden===show)c.hidden=!show;
  const h=tb.offsetHeight;document.documentElement.style.setProperty("--tb",h+"px");document.documentElement.style.scrollPaddingTop=(h+12)+"px"}
addEventListener("scroll",()=>{syncTopbar();let cur=secs[0];for(const s of secs){if($(s).getBoundingClientRect().top<120)cur=s}
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+cur))},{passive:true});
addEventListener("resize",syncTopbar);
/* ── horizontal scrolling for tab rows: arrows when overflowing, wheel, mouse drag ── */
function hscroll(el,label){const w=document.createElement("div");w.className="hsw";el.parentNode.insertBefore(w,el);w.appendChild(el);el.classList.add("hscroll");
  const mk=(c,t)=>{const b=document.createElement("button");b.type="button";b.className="harr "+c;b.textContent=t;b.hidden=true;b.setAttribute("aria-label",(c==="l"?"Scroll left":"Scroll right")+" — "+label);w.appendChild(b);return b};
  const L=mk("l","‹"),R=mk("r","›");
  const upd=()=>{const over=el.scrollWidth>el.clientWidth+2;L.hidden=!over||el.scrollLeft<=2;R.hidden=!over||el.scrollLeft>=el.scrollWidth-el.clientWidth-2};
  const step=d=>el.scrollBy({left:d*Math.max(160,el.clientWidth*0.6),behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
  L.addEventListener("click",()=>step(-1));R.addEventListener("click",()=>step(1));
  el.addEventListener("scroll",upd,{passive:true});addEventListener("resize",upd);new MutationObserver(upd).observe(el,{childList:true,subtree:true});
  el.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&el.scrollWidth>el.clientWidth+2){const max=el.scrollWidth-el.clientWidth;const nx=Math.min(max,Math.max(0,el.scrollLeft+e.deltaY));if(nx!==el.scrollLeft){el.scrollLeft=nx;e.preventDefault()}}},{passive:false});
  let down=false,x0=0,s0=0,moved=false;
  el.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;down=true;moved=false;x0=e.clientX;s0=el.scrollLeft});
  addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-x0;if(!moved&&Math.abs(dx)>5){moved=true;el.classList.add("drag")}if(moved)el.scrollLeft=s0-dx});
  addEventListener("pointerup",()=>{if(!down)return;down=false;if(moved)setTimeout(()=>el.classList.remove("drag"),0)});
  el.addEventListener("click",e=>{if(moved){e.preventDefault();e.stopPropagation()}},true);
  setTimeout(upd,0);return upd}
const navUpd=hscroll($("tabs"),"menu");hscroll($("catSeg"),"categories");hscroll($("viewSeg"),"sort");
/* keep the current section's tab visible in the menu row */
let lastCur="";function revealTab(){const a=document.querySelector("#tabs a.on");if(!a)return;const n=$("tabs"),pad=40;
  const l=a.offsetLeft-n.offsetLeft,r=l+a.offsetWidth;if(l<n.scrollLeft+pad)n.scrollTo({left:Math.max(0,l-pad),behavior:"smooth"});else if(r>n.scrollLeft+n.clientWidth-pad)n.scrollTo({left:r-n.clientWidth+pad,behavior:"smooth"})}
addEventListener("scroll",()=>{const a=document.querySelector("#tabs a.on");const c=a?a.getAttribute("href"):"";if(c!==lastCur){lastCur=c;revealTab()}},{passive:true});

/* after changing a nearby filter, jump back to the top of the list */
["catSeg","viewSeg"].forEach(id=>$(id).addEventListener("click",e=>{if(!e.target.closest("button"))return;
  requestAnimationFrame(()=>{const y=$("todo").getBoundingClientRect().top+scrollY-$("topbar").offsetHeight-8;if(scrollY>y)scrollTo({top:y})})}));
renderAll();syncTopbar();
</script>
