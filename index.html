<style>
:root{
  --fs:1;
  --bg:#f7f4ef; --surface:#ffffff; --ink:#1f1b18; --muted:#62584f; --line:#e3dbd0; --chip:#efe8de;
  --accent:#a8231c; --accent-ink:#ffffff; --gold:#b07a00; --soft:#fbefe6;
  --c12:#a8231c; --c14:#2f5ea8; --c39:#b8560f; --c38:#8a3b78; --c28:#2f7d3e; --cT:#7a5a2b;
  --display:"Fraunces",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151210; --surface:#201c19; --ink:#f1ebe4; --muted:#b3a89c; --line:#3a332d; --chip:#2b2521;
  --accent:#ef7a6e; --accent-ink:#1a0f0d; --gold:#e5b54a; --soft:#2c201c;
  --c12:#ef7a6e; --c14:#8fb0ec; --c39:#f0a065; --c38:#d996c6; --c28:#84cf8f; --cT:#d9b07a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151210; --surface:#201c19; --ink:#f1ebe4; --muted:#b3a89c; --line:#3a332d; --chip:#2b2521;
  --accent:#ef7a6e; --accent-ink:#1a0f0d; --gold:#e5b54a; --soft:#2c201c;
  --c12:#ef7a6e; --c14:#8fb0ec; --c39:#f0a065; --c38:#d996c6; --c28:#84cf8f; --cT:#d9b07a; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(15.5px*var(--fs));line-height:1.6;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:40px}
button{font:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.pill{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.pill button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:calc(13px*var(--fs));padding:5px 13px;cursor:pointer}
.pill button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
header{display:flex;flex-direction:column;gap:18px}
.hero{display:flex;gap:clamp(16px,3vw,28px);align-items:center}
.logo{width:clamp(78px,12vw,112px);height:auto;flex:none;background:#fff;border-radius:14px;padding:8px;box-shadow:0 0 0 1px var(--line)}
.eyebrow{font-family:var(--display);color:var(--accent);font-size:calc(clamp(17px,2.2vw,21px)*var(--fs));font-weight:500}
h1{font-family:var(--display);font-size:calc(clamp(27px,4.4vw,42px)*var(--fs));line-height:1.15;margin:2px 0 4px;font-weight:700}
.sub{color:var(--muted);font-weight:500}
.hotelbox{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;max-width:780px}
.hotelbox .k{font-size:calc(11.5px*var(--fs));font-weight:700;letter-spacing:.08em;color:var(--gold);text-transform:uppercase}
.hotelbox b{font-size:calc(16.5px*var(--fs))}
.hotelbox .row{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center}
.hotelbox select{font:inherit;font-size:calc(14px*var(--fs));padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}
.note{font-size:calc(13px*var(--fs));color:var(--muted);margin:0}

/* nav */
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);margin:-16px 0 -16px;display:flex;overflow-x:auto;scrollbar-width:none;padding-top:env(safe-area-inset-top,0px)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:600;font-size:calc(14px*var(--fs));padding:12px 12px 10px;border-bottom:3px solid transparent}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}

section{display:flex;flex-direction:column;gap:16px;min-width:0}
h2{font-family:var(--display);font-size:calc(clamp(23px,3vw,28px)*var(--fs));margin:0;font-weight:700}
.lead{margin:0;color:var(--muted);max-width:760px}

/* schedule */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.day.main{border-color:var(--accent);box-shadow:inset 0 4px 0 var(--accent)}
.day .dt{font-size:calc(12px*var(--fs));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.day h3{margin:0;font-size:calc(18px*var(--fs))}
.ev{display:grid;grid-template-columns:88px minmax(0,1fr);gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.ev .t{font-weight:700;font-variant-numeric:tabular-nums;font-size:calc(14px*var(--fs))}
.ev p{margin:0;font-size:calc(14.5px*var(--fs))}
.ev .w{color:var(--muted);font-size:calc(13.5px*var(--fs))}
.ev .lk{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:calc(13.5px*var(--fs));margin-top:2px}
.lk{display:flex;flex-wrap:wrap;gap:4px 14px}
.lk a,.lk button{color:var(--accent);font-weight:600;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:inherit}
.lk a:hover,.lk button:hover{text-decoration:underline}

/* info cards */
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.ic{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ic.req{border-left:4px solid var(--accent)}
.ic .k{font-size:calc(11.5px*var(--fs));font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ic.req .k{color:var(--accent)}
#depCards{max-width:820px}
.ic h3{margin:0;font-size:calc(17px*var(--fs))}
.ic p,.ic li{margin:0;font-size:calc(14.5px*var(--fs));color:var(--muted)}
.ic b{color:var(--ink)}
.ic ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.btn{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:calc(14px*var(--fs));text-decoration:none;margin-top:4px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.emerg{display:flex;flex-wrap:wrap;gap:10px}
.emerg div{background:var(--soft);border-radius:10px;padding:8px 12px;min-width:120px}
.emerg b{display:block;font-size:calc(22px*var(--fs));font-variant-numeric:tabular-nums;color:var(--accent)}
.emerg span{font-size:calc(13px*var(--fs));color:var(--muted)}

/* places + map */
.ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;font-size:calc(13.5px*var(--fs));cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.mapbox{position:sticky;top:60px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mapbox iframe{width:100%;height:min(70vh,600px);min-height:340px;border:1px solid var(--line);border-radius:12px;background:var(--chip);display:block}
.maphead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.maphead b{font-size:calc(14.5px*var(--fs));overflow:hidden;text-overflow:ellipsis}
.maphead a{font-size:calc(13.5px*var(--fs));font-weight:600;text-decoration:none;white-space:nowrap}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}.mapbox{position:static;order:-1}.mapbox iframe{height:52vh;min-height:300px}}
/* beyond seoul */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:16px}
.bc{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;scroll-margin-top:70px}
.bc.on{outline:2px solid var(--accent)}
.bc .r{font-size:calc(11.5px*var(--fs));font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.bc h3{margin:0;font-size:calc(17px*var(--fs))}
.bc .how{font-size:calc(13.5px*var(--fs));font-weight:600}
.bc p{margin:0;font-size:calc(14px*var(--fs));color:var(--muted)}
.bc .tip{font-size:calc(13px*var(--fs));color:var(--ink);background:var(--soft);border-radius:6px;padding:6px 9px}
.bc .lk{margin-top:auto;padding-top:6px;font-size:calc(13px*var(--fs))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;scroll-margin-top:70px}
.card.on{outline:2px solid var(--accent)}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:var(--chip)}
.dist{position:absolute;left:10px;bottom:10px;background:var(--surface);color:var(--ink);font-size:calc(12px*var(--fs));font-weight:700;border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:calc(11.5px*var(--fs));font-weight:700;color:var(--c)}
.card h3{font-size:calc(15.5px*var(--fs));margin:0;line-height:1.35}
.card p{margin:0;font-size:calc(13.5px*var(--fs));color:var(--muted)}
.card .lk{margin-top:auto;padding-top:8px;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:calc(13px*var(--fs))}
.empty{color:var(--muted)}
footer{border-top:1px solid var(--line);padding-top:20px;font-size:calc(12.5px*var(--fs));color:var(--muted);display:flex;flex-direction:column;gap:6px}
footer p{margin:0}
</style>
</head>

const VENUES = {

};
const CATS = ["12","14","39","38","28","T"];
/* ── Beyond Seoul: recommended destinations (EN/ES) ── */
const BEYOND = [{"id": "dmz","lat": 37.8895,"lng": 126.74,"z": 11,"q": "Imjingak, Paju","en": {"n": "DMZ (Demilitarized Zone)","r": "Gyeonggi-do · day trip","how": "About 1 h by tour bus from Seoul","p": "The border between North and South Korea: Imjingak, the Third Infiltration Tunnel and Dora Observatory. A unique look at modern Korean history.","tip": "Guided tours only — book ahead and bring your passport. Access and programmes can change."},"es": {"n": "DMZ (Zona Desmilitarizada)","r": "Gyeonggi-do · excursión de un día","how": "Aprox. 1 h en autobús de tour desde Seúl","p": "La frontera entre las dos Coreas: Imjingak, el Tercer Túnel de Infiltración y el Observatorio Dora. Una mirada única a la historia reciente de Corea.","tip": "Solo con visita guiada: reserve con antelación y lleve el pasaporte. Los accesos y programas pueden cambiar."}},{"id": "suwon","lat": 37.2819,"lng": 127.0137,"z": 14,"q": "Hwaseong Fortress, Suwon","en": {"n": "Suwon Hwaseong Fortress","r": "Suwon · day trip · UNESCO","how": "About 30 min by train (ITX/KTX) or 1 h by subway Line 1 to Suwon Station","p": "An 18th-century walled city — walk the 5.7 km of ramparts, gates and watchtowers, then visit Hwaseong Haenggung palace.","tip": "Combine with Suwon's famous grilled ribs (galbi)."},"es": {"n": "Fortaleza Hwaseong de Suwon","r": "Suwon · excursión de un día · UNESCO","how": "Aprox. 30 min en tren (ITX/KTX) o 1 h en la línea 1 de metro hasta Suwon Station","p": "Una ciudad amurallada del siglo XVIII: recorra los 5,7 km de murallas, puertas y torres de vigilancia, y visite el palacio Hwaseong Haenggung.","tip": "Aprovéchelo para probar las famosas costillas a la brasa (galbi) de Suwon."}},{"id": "nami","lat": 37.7905,"lng": 127.5255,"z": 13,"q": "Nami Island","en": {"n": "Nami Island & Gapyeong","r": "Gangwon/Gyeonggi · day trip","how": "About 1 h by ITX-Cheongchun train to Gapyeong, then taxi and a short ferry","p": "A river island of tree-lined avenues, famous from Korean dramas. Easy to combine with the Garden of Morning Calm.","tip": "Late November is the end of the autumn colours — dress warmly."},"es": {"n": "Isla Nami y Gapyeong","r": "Gangwon/Gyeonggi · excursión de un día","how": "Aprox. 1 h en tren ITX-Cheongchun hasta Gapyeong, luego taxi y un ferri corto","p": "Una isla fluvial con avenidas de árboles, famosa por los dramas coreanos. Se combina fácilmente con el Jardín de la Calma Matinal.","tip": "A finales de noviembre terminan los colores de otoño: abríguese bien."}},{"id": "busan","lat": 35.0975,"lng": 129.0106,"z": 12,"q": "Gamcheon Culture Village, Busan","en": {"n": "Busan","r": "Korea's second city · 1–2 days","how": "About 2 h 30 min by KTX from Seoul Station","p": "Beaches (Haeundae, Gwangalli), the colourful hillside Gamcheon Culture Village, Jagalchi fish market and the seaside Haedong Yonggungsa temple.","tip": "The most recommended city after Seoul in Spanish travel guides."},"es": {"n": "Busan","r": "Segunda ciudad de Corea · 1–2 días","how": "Aprox. 2 h 30 min en KTX desde Seoul Station","p": "Playas (Haeundae, Gwangalli), el colorido barrio de Gamcheon en la ladera, el mercado de pescado Jagalchi y el templo junto al mar Haedong Yonggungsa.","tip": "La ciudad más recomendada después de Seúl en las guías de viaje españolas."}},{"id": "gyeongju","lat": 35.79,"lng": 129.332,"z": 12,"q": "Bulguksa, Gyeongju","en": {"n": "Gyeongju","r": "Ancient Silla capital · 1–2 days · UNESCO","how": "About 2 h by KTX to Singyeongju Station","p": "An open-air museum: Bulguksa Temple and Seokguram Grotto, the royal tumuli of Daereungwon and Donggung Palace & Wolji Pond, beautiful when lit at night.","tip": "Easy to pair with Busan (about 30 min apart by KTX)."},"es": {"n": "Gyeongju","r": "Antigua capital de Silla · 1–2 días · UNESCO","how": "Aprox. 2 h en KTX hasta la estación de Singyeongju","p": "Un museo al aire libre: el templo Bulguksa y la gruta de Seokguram, los túmulos reales de Daereungwon y el palacio Donggung con el estanque Wolji, precioso iluminado de noche.","tip": "Fácil de combinar con Busan (unos 30 min en KTX)."}},{"id": "jeonju","lat": 35.815,"lng": 127.153,"z": 14,"q": "Jeonju Hanok Village","en": {"n": "Jeonju Hanok Village","r": "Jeollabuk-do · day trip or overnight","how": "About 1 h 40 min by KTX from Yongsan Station","p": "Over 700 traditional hanok houses, the birthplace of bibimbap and a capital of Korean food — perfect for food lovers.","tip": "Stay a night in a hanok guesthouse."},"es": {"n": "Aldea Hanok de Jeonju","r": "Jeollabuk-do · un día o una noche","how": "Aprox. 1 h 40 min en KTX desde la estación de Yongsan","p": "Más de 700 casas tradicionales hanok, la cuna del bibimbap y una capital de la gastronomía coreana: ideal para amantes de la comida.","tip": "Duerma una noche en una casa hanok."}},{"id": "andong","lat": 36.539,"lng": 128.518,"z": 13,"q": "Hahoe Folk Village, Andong","en": {"n": "Andong Hahoe Folk Village","r": "Gyeongsangbuk-do · day trip or overnight · UNESCO","how": "About 2 h by KTX-Eum from Cheongnyangni Station","p": "A living Joseon-era clan village on a river bend, home of the Hahoe mask dance and the Confucian academies of Andong.","tip": "For travellers who want the quieter, traditional side of Korea."},"es": {"n": "Aldea Folclórica Hahoe de Andong","r": "Gyeongsangbuk-do · un día o una noche · UNESCO","how": "Aprox. 2 h en KTX-Eum desde la estación de Cheongnyangni","p": "Una aldea viva de la era Joseon en un meandro del río, cuna de la danza de máscaras Hahoe y de las academias confucianas de Andong.","tip": "Para quien busca el lado más tranquilo y tradicional de Corea."}},{"id": "jeju","lat": 33.458,"lng": 126.942,"z": 10,"q": "Seongsan Ilchulbong","en": {"n": "Jeju Island","r": "Volcanic island · 2–3 days · UNESCO","how": "About 1 h 10 min by plane from Gimpo Airport","p": "Volcanic landscapes: Hallasan, the Seongsan Ilchulbong crater, lava tubes, the coastal Olle walking trails and the haenyeo women divers.","tip": "Rent a car or join a tour — public transport is slow outside Jeju City."},"es": {"n": "Isla de Jeju","r": "Isla volcánica · 2–3 días · UNESCO","how": "Aprox. 1 h 10 min en avión desde el aeropuerto de Gimpo","p": "Paisajes volcánicos: el Hallasan, el cráter Seongsan Ilchulbong, tubos de lava, los senderos costeros Olle y las haenyeo, mujeres buceadoras.","tip": "Alquile un coche o haga un tour: el transporte público es lento fuera de Jeju City."}},{"id": "seorak","lat": 38.119,"lng": 128.4655,"z": 11,"q": "Seoraksan National Park","en": {"n": "Seoraksan & Gangneung","r": "Gangwon-do · 1–2 days","how": "About 2 h by KTX to Gangneung; Seoraksan is about 1 h further by bus","p": "Granite peaks and the cable car of Seoraksan National Park, plus the coffee street and beaches of Gangneung on the East Sea.","tip": "Mountain weather in late November can be below freezing."},"es": {"n": "Seoraksan y Gangneung","r": "Gangwon-do · 1–2 días","how": "Aprox. 2 h en KTX hasta Gangneung; Seoraksan está a 1 h más en autobús","p": "Picos de granito y el teleférico del Parque Nacional Seoraksan, además de la calle del café y las playas de Gangneung en el mar del Este.","tip": "En la montaña puede helar a finales de noviembre."}},{"id": "temple","lat": 37.574,"lng": 126.9817,"z": 15,"q": "Jogyesa Temple, Seoul","url": "https://eng.templestay.com/","en": {"n": "Templestay","r": "Across Korea · 1 night (or a few hours)","how": "Programmes at temples in Seoul and around the country","p": "Stay at a Buddhist temple: dawn ceremony, meditation, temple food and tea with monks. Short day programmes are available in central Seoul too.","tip": "Book on the official Templestay site."},"es": {"n": "Templestay","r": "Toda Corea · 1 noche (o unas horas)","how": "Programas en templos de Seúl y de todo el país","p": "Alójese en un templo budista: ceremonia del amanecer, meditación, comida de templo y té con los monjes. También hay programas cortos en el centro de Seúl.","tip": "Reserve en la web oficial de Templestay."   dep:[{k:"Salida · Incheon (ICN)",h:"ICN Smart Pass — salida más rápida",p:"¿Vuelve desde el <b>aeropuerto de Incheon</b>? Regístrese una vez en la app gratuita <b>ICN SmartPass</b> y pase desde la entrada de salidas hasta la puerta de embarque con <b>reconocimiento facial</b>, sin mostrar el pasaporte y la tarjeta de embarque en cada control.",list:["<b>1.</b> Escanee su pasaporte (evite reflejos); se necesita pasaporte electrónico","<b>2.</b> Registre su rostro en la app","<b>3.</b> Añada su tarjeta de embarque: código QR móvil o código de barras en papel (no es necesario si se añade automáticamente)","¿Sin app? Puede registrarse en un quiosco de autofacturación del aeropuerto.","Lleve igualmente el pasaporte y la tarjeta de embarque, no en el equipaje facturado. A partir de 7 años; menores de 14 necesitan consentimiento de un tutor. Los datos faciales se guardan 5 años."],links:[["App Store ↗","https://apps.apple.com/kr/app/icn-smartpass-%EC%9D%B8%EC%B2%9C%EA%B3%B5%ED%95%AD-%EC%8A%A4%EB%A7%88%ED%8A%B8%ED%8C%A8%EC%8A%A4/id6443837919"],["Google Play ↗","https://play.google.com/store/apps/details?id=kr.airport.android.smartpass"],["Cómo funciona (aeropuerto de Incheon) ↗","https://sps-mapi.airport.kr:8420/resources/html/info_smartpass.html"]]}],
  cat:{"12":"Lugares de interés","14":"Cultura","39":"Comida y cafés","38":"Compras","28":"Paseos y ocio","T":"Paradas del City Tour Bus"},
  all:"Todo", vCat:"Por categoría", vNear:"Más cerca primero",
  todoLead:h=>`Lugares populares del centro de Seúl (Jung-gu y Jongno-gu), ordenados por distancia desde ${h}. Pulse «Ver en el mapa» para verlo en el mapa. Los nombres y descripciones están en inglés.`,
  tourSpan:"Seoul City Tour Bus — ruta Centro, Palacios y Namsan · sube y baja libremente · 15 paradas en orden de ruta · consulte tarifas y horarios a bordo · no circula los lunes",
  walk:m=>m<60?`~${Math.max(1,m)} min a pie`:`~${Math.floor(m/60)} h ${m%60} min a pie`, far:"mejor en metro o taxi",
  fromH:"desde su hotel", none:"No hay lugares en esta categoría.",
  mapNote:"El mapa es de Google Maps. Use «Cómo llegar» en cada lugar para ver la ruta desde su hotel; para rutas a pie en Corea, NAVER Map es más preciso.",
  src1:"<b>Lugares:</b> seleccionados entre los más vistos de VisitKorea, la web oficial de la Organización de Turismo de Corea (consulta: 22 oct. 2026). Nombres, descripciones, direcciones y fotos © Korea Tourism Organization. Las distancias son en línea recta y los tiempos a pie, estimados.",
  src2:"<b>Las normas de entrada</b> (e-Arrival Card, K-ETA) pueden cambiar: consulte las webs oficiales antes de viajar.",
  src3:"Elaborado por AVIAREPS Korea para los participantes de Spain Travel Market 2026 in Seoul."
}};

/* ── state ── */
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const qs=new URLSearchParams(location.search);
let lang=(qs.get("lang")||store.get("stmLang")||((navigator.language||"").startsWith("es")?"es":"en"));if(!T[lang])lang="en";
let FS=+store.get("stmFs")||1;if(![1,1.15,1.3].includes(FS))FS=1;
let hotel=HOTELS.find(h=>h.id===qs.get("hotel"))||HOTELS.find(h=>h.id===store.get("stmHotel"))||HOTELS[0];
let cat="all", view="cat", mapSel=null;
const t=()=>T[lang];
const $=id=>document.getElementById(id);
const enc=encodeURIComponent;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

/* ── geo & links ── */
function hav(a,b,c,d){const R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r;const h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const km=p=>p.lat==null?Infinity:hav(hotel.lat,hotel.lng,p.lat,p.lng);
const fmt=d=>!isFinite(d)?"—":d<1?Math.round(d*100)*10+" m":d.toFixed(1)+" km";
const walk=d=>!isFinite(d)?"":d>3?t().far:t().walk(Math.round(d*1.3/4.5*60));
const gq=p=>p.lat!=null?p.lat+","+p.lng:(p.en+", "+p.a+", Seoul");
const gPlace=p=>"https://www.google.com/maps/search/?api=1&query="+enc(gq(p))+"&hl="+lang;
const gDir=p=>"https://www.google.com/maps/dir/?api=1&origin="+enc(hotel.lat+","+hotel.lng)+"&destination="+enc(gq(p))+"&hl="+lang;
const nMap=p=>"https://map.naver.com/p/search/"+enc(String(p.ko).replace(/^\d+\.\s*/,"").split("·")[0].replace(/\(.*?\)/g,"").trim());
const embed=p=>"https://maps.google.com/maps?q="+enc(gq(p))+"&z="+(p.z||16)+"&hl="+lang+"&output=embed";

/* ── map ── */
function showMap(p,scroll){mapSel=p;$("map").src=embed(p);$("mapName").textContent=p.label||p.en;$("mapOpen").href=gPlace(p);$("mapOpen").textContent=t().gmap;
  document.querySelectorAll(".card.on").forEach(c=>c.classList.remove("on"));if(p.i!=null){const c=$("p"+p.i);if(c)c.classList.add("on")}
  if(scroll)$("mapbox").scrollIntoView({block:"start"})}
const hotelPlace=()=>({en:hotel.en,ko:hotel.ko,lat:hotel.lat,lng:hotel.lng,label:hotel.en,z:16});

/* ── header ── */
function renderHotel(){
  $("hName").textContent=hotel.en;
  $("hAddr").innerHTML=`${esc(hotel.addr)}<br><span class="note">${esc(hotel.addrKo)}</span>`;
  const hp=hotelPlace();
  $("hLinks").innerHTML=`<a href="${gPlace(hp)}" target="_blank" rel="noopener">${t().gmap}</a><a href="https://map.naver.com/p/search/${enc(hotel.ko)}" target="_blank" rel="noopener">${t().nmap}</a><button type="button" id="hOnMap">${t().onMap}</button>`;
  $("hOnMap").onclick=()=>{document.getElementById("todo").scrollIntoView();showMap(hotelPlace(),false)};
  const sel=$("hotelSel");sel.hidden=HOTELS.length<2;
  if(HOTELS.length>1){sel.setAttribute("aria-label",t().pick);sel.innerHTML=HOTELS.map(h=>`<option value="${h.id}"${h===hotel?" selected":""}>${esc(h.en)}</option>`).join("")}
}
$("hotelSel").addEventListener("change",e=>{hotel=HOTELS.find(h=>h.id===e.target.value)||HOTELS[0];store.set("stmHotel",hotel.id);mapSel=null;renderAll()});

/* ── schedule & info ── */
function renderSchedule(){
  $("days").innerHTML=t().days.map(d=>`<div class="day${d.main?" main":""}"><div class="dt">${d.dt}</div><h3>${d.h}</h3>${d.ev.map(e=>{const v=e.v&&VENUES[e.v];
    return `<div class="ev"><div class="t">${e.t}</div><div><p>${e.p}</p>${e.w?`<div class="w">${e.w}</div>`:""}${v?`<div class="lk"><a href="${gPlace(v)}" target="_blank" rel="noopener">${t().gmap}</a><button type="button" data-venue="${e.v}">${t().onMap}</button></div>`:""}</div></div>`}).join("")}</div>`).join("");
}
document.addEventListener("click",e=>{const b=e.target.closest("button[data-venue]");if(!b)return;const v=VENUES[b.dataset.venue];showMap({...v,label:v.en,z:16},true)});
function cards(arr){return arr.map(c=>`<div class="ic${c.req?" req":""}"><div class="k">${c.k}</div><h3>${c.h}</h3>${c.p?`<p>${c.p}</p>`:""}${c.list?`<ul>${c.list.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}${c.emerg?`<div class="emerg">${c.emerg.map(([n,l])=>`<div><b><a href="tel:${n}" style="color:inherit;text-decoration:none">${n}</a></b><span>${l}</span></div>`).join("")}</div>`:""}${c.btn?`<a class="btn${c.ghost?" ghost":""}" href="${c.btn[1]}" target="_blank" rel="noopener">${c.btn[0]}</a>`:""}${c.links?`<div class="lk">${c.links.map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">${l}</a>`).join("")}</div>`:""}${c.note?`<p class="note">${c.note}</p>`:""}</div>`).join("")}

/* ── places ── */
const IDX=PLACES.map((p,i)=>(p.i=i,i)).filter(i=>CATS.includes(PLACES[i].c));
function card(i){const p=PLACES[i],d=km(p);
  return `<article class="card${mapSel&&mapSel.i===i?" on":""}" id="p${i}" style="--c:var(--c${p.c})"><div class="ph"><img src="${p.img}" alt="" loading="lazy"><span class="dist">${fmt(d)}</span></div>
  <div class="bd"><span class="cat">${t().cat[p.c]}</span><h3>${esc(p.en)}</h3><p>${esc(p.d)}</p><p>${esc(p.a)}</p>${isFinite(d)?`<p>${esc(walk(d))} ${t().fromH}</p>`:""}
  <div class="lk"><button type="button" data-i="${i}">${t().onMap}</button><a href="${gDir(p)}" target="_blank" rel="noopener">${t().dir}</a><a href="${nMap(p)}" target="_blank" rel="noopener">${t().nmap}</a>${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${t().info}</a>`:""}</div></div></article>`}
function renderPlaces(){
  $("todoLead").textContent=t().todoLead(hotel.en);
  $("catSeg").innerHTML=[["all",t().all],...CATS.map(k=>[k,t().cat[k]])].map(([k,n])=>`<button type="button" data-cat="${k}" aria-pressed="${k===cat}">${n}</button>`).join("");
  $("viewSeg").innerHTML=[["cat",t().vCat],["near",t().vNear]].map(([k,n])=>`<button type="button" data-view="${k}" aria-pressed="${k===view}">${n}</button>`).join("");
  const ids=IDX.filter(i=>cat==="all"||PLACES[i].c===cat);
  if(view==="near"){const s=ids.slice().sort((a,b)=>km(PLACES[a])-km(PLACES[b]));$("list").innerHTML=`<div class="grid">${s.map(card).join("")||`<p class="empty">${t().none}</p>`}</div>`;return}
  $("list").innerHTML=CATS.filter(k=>cat==="all"||cat===k).map(k=>{let g=ids.filter(i=>PLACES[i].c===k);
    g.sort(k==="T"?(a,b)=>PLACES[a].n-PLACES[b].n:(a,b)=>km(PLACES[a])-km(PLACES[b]));
    return `<div style="margin-bottom:28px"><h3 style="margin:0 0 4px;font-family:var(--display);font-size:calc(20px*var(--fs))">${t().cat[k]}</h3>${k==="T"?`<p class="note" style="margin-bottom:10px">${t().tourSpan}</p>`:`<div style="height:8px"></div>`}<div class="grid">${g.map(card).join("")||`<p class="empty">${t().none}</p>`}</div></div>`}).join("");
}
$("catSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.cat;renderPlaces()});
$("viewSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;view=b.dataset.view;renderPlaces()});
$("list").addEventListener("click",e=>{const b=e.target.closest("button[data-i]");if(!b)return;const p=PLACES[+b.dataset.i];
  showMap({...p,label:p.en},matchMedia("(max-width:860px)").matches)});

/* ── language, text size, nav ── */
function renderAll(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t()[el.dataset.t];if(typeof v==="string")el.innerHTML=v});
  document.querySelectorAll("#langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll("#fsz button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.fs===FS));
  renderHotel();renderSchedule();
  $("beforeCards").innerHTML=cards(t().before);$("aroundCards").innerHTML=cards(t().around);$("goodCards").innerHTML=cards(t().good);$("depCards").innerHTML=cards(t().dep);
  renderPlaces();renderBeyond();
  showMap(mapSel&&mapSel.i!=null?{...mapSel,label:mapSel.en}:(mapSel||hotelPlace()),false);
}
$("langs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;lang=b.dataset.lang;store.set("stmLang",lang);renderAll()});
$("fsz").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;FS=+b.dataset.fs;store.set("stmFs",FS);document.documentElement.style.setProperty("--fs",FS);renderAll()});
document.documentElement.style.setProperty("--fs",FS);
/* ── beyond Seoul ── */
let bSel=null;
function bShow(b,scroll){bSel=b;const p={lat:b.lat,lng:b.lng,z:b.z};$("bmap").src=embed(p);$("bmapName").textContent=b[lang].n;$("bmapOpen").href="https://www.google.com/maps/search/?api=1&query="+enc(b.q)+"&hl="+lang;$("bmapOpen").textContent=t().gmap;
  document.querySelectorAll(".bc.on").forEach(c=>c.classList.remove("on"));const c=$("b-"+b.id);if(c)c.classList.add("on");if(scroll)$("bmapbox").scrollIntoView({block:"start"})}
function renderBeyond(){
  $("beyondList").innerHTML=BEYOND.map(b=>{const x=b[lang];return `<article class="bc" id="b-${b.id}"><div class="r">${x.r}</div><h3>${x.n}</h3><div class="how">${x.how}</div><p>${x.p}</p><div class="tip">${x.tip}</div>
    <div class="lk"><button type="button" data-b="${b.id}">${t().onMap}</button><a href="https://www.google.com/maps/search/?api=1&query=${enc(b.q)}&hl=${lang}" target="_blank" rel="noopener">${t().gmap}</a>${b.url?`<a href="${b.url}" target="_blank" rel="noopener">${t().info}</a>`:""}</div></article>`}).join("");
  bShow(bSel||BEYOND[0],false)}
$("beyondList").addEventListener("click",e=>{const b=e.target.closest("button[data-b]");if(!b)return;bShow(BEYOND.find(x=>x.id===b.dataset.b),matchMedia("(max-width:860px)").matches)});
const secs=["schedule","before","around","good","dep","todo","beyond"];
addEventListener("scroll",()=>{let cur=secs[0];for(const s of secs){if($(s).getBoundingClientRect().top<120)cur=s}
  document.querySelectorAll("#tabs a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+cur))},{passive:true});
renderAll();
</script>
</body>
</html>
