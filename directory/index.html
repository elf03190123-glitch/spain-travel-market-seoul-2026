<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Spain Travel Market 2026 in Seoul — Participants</title>
<meta name="description" content="Spanish exhibitors and Korean buyers at the B2B Travel Mart, Spain Travel Market 2026 in Seoul (26 Nov 2026).">
<meta name="robots" content="noindex">
<link rel="icon" href="../turespana-logo.jpg">
<title>Spain Travel Market Seoul 참가사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 행사 안내 사이트와 같은 색·글꼴. 머리(행사 정보·숫자) → 셀러|바이어 탭 → 분류 칩·검색 → 카드 그리드. 셀러는 B2B 테이블 번호, 바이어는 바이어 번호를 카드 왼쪽 위 표지로. */
:root{
  --bg:#f7f4ef; --surface:#ffffff; --ink:#1f1b18; --muted:#62584f; --line:#e3dbd0; --chip:#efe8de;
  --accent:#a8231c; --accent-ink:#ffffff; --gold:#b07a00; --soft:#fbefe6; --sea:#2f5ea8; --sea-soft:#e8eef8;
  --display:"Fraunces","Noto Sans KR",Georgia,serif;
  --body:"Inter","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs:1;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151210; --surface:#201c19; --ink:#f1ebe4; --muted:#b3a89c; --line:#3a332d; --chip:#2b2521;
  --accent:#ef7a6e; --accent-ink:#1a0f0d; --gold:#e5b54a; --soft:#2c201c; --sea:#8fb0ec; --sea-soft:#1d2533; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151210; --surface:#201c19; --ink:#f1ebe4; --muted:#b3a89c; --line:#3a332d; --chip:#2b2521;
  --accent:#ef7a6e; --accent-ink:#1a0f0d; --gold:#e5b54a; --soft:#2c201c; --sea:#8fb0ec; --sea-soft:#1d2533; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(15px*var(--fs));line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.hero{border-bottom:1px solid var(--line);background:var(--surface)}
header.hero .wrap{padding-block:28px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:start}
.eyebrow{font-size:calc(12px*var(--fs));letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-family:var(--display);font-weight:700;font-size:calc(clamp(28px,4.4vw,44px)*var(--fs));line-height:1.08;margin:6px 0 8px;text-wrap:balance;letter-spacing:-.01em}
.meta{color:var(--muted);font-size:calc(14px*var(--fs));display:flex;flex-wrap:wrap;gap:4px 14px}
.meta b{color:var(--ink);font-weight:600}
.counts{display:flex;gap:10px}
.count{border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:96px;background:var(--bg)}
.count b{display:block;font-family:var(--display);font-size:calc(30px*var(--fs));line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:calc(12px*var(--fs));color:var(--muted)}
.lang{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;margin-top:-6px}
.lang{align-items:center;flex-wrap:wrap}
/* 안내 사이트(GitHub Pages)와 같은 알약 단추 */
.pill{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.pill button{font:inherit;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:calc(13px*var(--fs));padding:5px 13px;cursor:pointer;line-height:1.4}
.pill button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tab,.chip{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font-size:calc(15px*var(--fs));font-weight:700;padding:9px 16px;border-radius:10px;display:flex;align-items:center;gap:8px}
.tab em{font-style:normal;font-weight:600;font-size:calc(12px*var(--fs));padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tab[aria-selected="true"] em{background:color-mix(in srgb,var(--accent-ink) 22%,transparent);color:var(--accent-ink)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{font-size:calc(13px*var(--fs));padding:5px 11px;border-radius:999px}
.chip b{font-weight:600;color:var(--muted);margin-left:3px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.75}
/* 2026-11-23 EJ: 한국 바이어 탭 먼저, 찾기 칸은 탭 줄 오른쪽에 띄워 눈에 띄게 */
.row1{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
.search{flex:0 1 380px;min-width:240px;margin-left:auto;position:relative}
.search input{width:100%;font:inherit;font-size:calc(15px*var(--fs));font-weight:500;padding:11px 14px 11px 40px;border-radius:12px;border:2px solid var(--sea);background:var(--surface);color:var(--ink);box-shadow:0 2px 10px color-mix(in srgb,var(--sea) 18%,transparent)}
.search input::placeholder{color:color-mix(in srgb,var(--sea) 70%,var(--muted));opacity:1}
.search input:focus{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--sea) 25%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--sea)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:22px 40px}
.lead{color:var(--muted);max-width:70ch;margin:0 0 18px;font-size:calc(14.5px*var(--fs))}
.found{font-size:calc(13px*var(--fs));color:var(--muted);margin:-8px 0 14px}
.found:empty{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.no{font-family:var(--display);font-weight:700;font-size:calc(22px*var(--fs));line-height:1;min-width:52px;text-align:center;padding:9px 6px 8px;border-radius:10px;border:2px solid var(--line);font-variant-numeric:tabular-nums}
.no small{display:block;font-family:var(--body);font-size:calc(10px*var(--fs));font-weight:600;letter-spacing:.08em;color:var(--muted);margin-bottom:3px}
.s .no{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.b .no{color:var(--sea);border-color:color-mix(in srgb,var(--sea) 45%,var(--line))}
.nm{min-width:0}
.nm h3{margin:0;font-size:calc(17px*var(--fs));line-height:1.3;font-weight:700;overflow-wrap:anywhere}
.nm .alt{font-size:calc(13.5px*var(--fs));color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:calc(12px*var(--fs));font-weight:600;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted)}
.s .tag.k{background:var(--soft);color:var(--accent)}
.b .tag.k{background:var(--sea-soft);color:var(--sea)}
.desc{margin:0;font-size:calc(14px*var(--fs));line-height:1.6}
.pts{margin:0;padding-left:18px;font-size:calc(13.5px*var(--fs));color:var(--ink);display:flex;flex-direction:column;gap:3px}
.pts li::marker{color:var(--accent)}
.b .pts li::marker{color:var(--sea)}
.foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:calc(12.5px*var(--fs));padding-top:8px;border-top:1px dashed var(--line)}
.foot a{color:var(--accent);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
.b .foot a{color:var(--sea)}
.foot a:hover{text-decoration:underline}
/* 바이어 1:1 미팅 일정(2026-11-23 EJ: 직원이 테이블 번호를 쉽게 확인) */
.mt{border:1px solid color-mix(in srgb,var(--sea) 30%,var(--line));background:var(--sea-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.mt-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:calc(13px*var(--fs))}
.mt-h b{font-size:calc(15px*var(--fs));font-variant-numeric:tabular-nums}
.mt-h .k{font-weight:700;color:var(--sea);font-size:calc(12px*var(--fs));letter-spacing:.04em}
.mt-h .c{color:var(--muted)}
.mt-f{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:calc(13.5px*var(--fs))}
.mt-f .k{color:var(--muted);font-size:calc(12.5px*var(--fs))}
.mt-f time{font-weight:700;font-variant-numeric:tabular-nums}
.tno{display:inline-grid;place-items:center;min-width:2.1em;padding:1px 6px;border-radius:7px;background:var(--sea);color:var(--surface);font-weight:700;font-size:calc(12.5px*var(--fs));font-variant-numeric:tabular-nums;line-height:1.5}
.mt-p{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:calc(13.5px*var(--fs))}
.mt-p .k{color:var(--muted);font-size:calc(12.5px*var(--fs));padding-top:1px}
.mt-p ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.mt-p li{display:flex;flex-wrap:wrap;gap:0 8px;align-items:baseline}
.mt-p .pn{font-weight:600}
.mt-p time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:calc(12.5px*var(--fs))}
/* 도착 예정 시간별 보기 */
.vbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin:-4px 0 14px}.vbar[hidden]{display:none}
.vbar .pill button{font-size:calc(14px*var(--fs));padding:7px 16px}
.onlynot{display:inline-flex;align-items:center;gap:6px;font-size:calc(14px*var(--fs));font-weight:600;cursor:pointer}.onlynot input{width:18px;height:18px;accent-color:var(--sea)}
.tlist{display:flex;flex-direction:column;gap:18px}
.tg h3{position:sticky;top:var(--barh,0px);z-index:2;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 8px;padding:8px 2px;background:var(--bg);border-bottom:2px solid var(--sea);font-size:calc(14px*var(--fs));color:var(--muted)}
.tg h3 time{font-family:var(--display);font-size:calc(24px*var(--fs));font-weight:700;color:var(--sea);font-variant-numeric:tabular-nums}
.tgc{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}.tgc.all{color:#1e7a46}
.tg h3 .sn{font-weight:700;color:var(--ink);font-size:calc(15px*var(--fs))}
.ag{margin:10px 0 0}.ag[hidden]{display:none}
.agh{font-size:calc(13.5px*var(--fs));color:var(--muted);margin:0 2px 6px}.agh b{font-size:calc(17px*var(--fs));color:var(--accent);font-variant-numeric:tabular-nums}
.plist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cr{display:grid;grid-template-columns:3.4em minmax(0,1.2fr) minmax(0,1fr);gap:6px 14px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
.cr:first-child{border-top:0}.cr[hidden]{display:none}
.pno{font-family:var(--display);font-weight:700;color:var(--sea);font-variant-numeric:tabular-nums;padding-top:1px}
.cm{display:flex;flex-direction:column;gap:4px;min-width:0}.cm .co{font-size:calc(15px*var(--fs));overflow-wrap:anywhere}
.pr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:calc(13.5px*var(--fs))}.pr[hidden]{display:none}
.pr .pn{font-weight:600}.pr time{color:var(--muted);font-size:calc(12.5px*var(--fs));font-variant-numeric:tabular-nums}
.pr.done .pn{color:#1e7a46}
.pf{font-size:calc(13px*var(--fs));min-width:0;padding-top:2px}.pf .k{color:var(--muted);font-size:calc(12px*var(--fs))}.pf time{font-weight:700}.pf .sl{overflow-wrap:anywhere}
@media (max-width:720px){.cr{grid-template-columns:3em minmax(0,1fr);padding:10px 12px}.cr .pf{grid-column:2}}
/* 참석자 체크인 단추 */
.ckb{font:inherit;cursor:pointer;margin-left:auto;border:1.5px solid var(--sea);background:var(--surface);color:var(--sea);font-weight:700;font-size:calc(13px*var(--fs));border-radius:999px;padding:5px 14px;min-height:34px;min-width:68px;font-variant-numeric:tabular-nums}
.ckb.on{background:#1e7a46;border-color:#1e7a46;color:#fff}
.ckb.arm{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ckb:disabled{opacity:.6}
.mt-p li{align-items:center}
.ckn{margin-left:2px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}.ckn.all{color:#1e7a46}
.ckst{font-size:calc(13px*var(--fs));color:var(--muted)}.ckst b{color:var(--ink)}.ckst .w{color:var(--accent);font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ckb.on{background:#3fa36c;border-color:#3fa36c;color:#0d1a12}}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:calc(12.5px*var(--fs))}
footer .wrap{padding-block:18px 28px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
/* 도착 안내(2026-11-23 EJ: 행사 30분 전 09:30 도착·등록, 지하철 호선·출구) */
.arrive{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 26px;align-items:center;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-left:6px solid var(--accent);border-radius:14px;background:var(--soft);padding:16px 22px}
.arr-time{display:flex;flex-direction:column;line-height:1.1}
.arr-time .k{font-size:calc(12px*var(--fs));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.arr-time b{font-family:var(--display);font-weight:700;font-size:calc(clamp(44px,6vw,60px)*var(--fs));color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.arr-time .d{font-size:calc(14px*var(--fs));font-weight:600}
.arr-note{margin:0 0 10px;font-size:calc(15.5px*var(--fs));font-weight:600;text-wrap:pretty}
.arr-note em{font-style:normal;color:var(--muted);font-weight:500}
.arr-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:calc(16px*var(--fs))}
.arr-sub .ln{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;padding:0 .3em;border-radius:999px;background:var(--c);color:#fff;font-weight:700;font-size:calc(14px*var(--fs))}
.arr-sub .ex{display:inline-grid;place-items:center;min-width:1.6em;height:1.6em;padding:0 .25em;border-radius:5px;background:#ffd200;color:#1f1b18;font-weight:800;font-size:calc(14px*var(--fs))}
.arr-sub b{font-weight:700}
.arr-sub span.t{color:var(--muted);font-size:calc(14px*var(--fs))}
@media (max-width:720px){.arrive{grid-template-columns:1fr;order:3;padding:14px 16px}}
/* 스페인관광청 로고(2026-11-23 EJ: 우측 상단) — 안내 사이트와 같은 흰 바탕 카드 */
.side{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
.logo{width:84px;height:auto;background:#fff;border-radius:12px;padding:7px;box-shadow:0 0 0 1px var(--line);display:block}
@media (max-width:720px){header.hero .wrap{position:relative}.side{display:contents}.logo{position:absolute;top:24px;right:16px;width:60px;padding:5px;border-radius:10px}.eyebrow,h1{padding-right:72px}}
@media (max-width:720px){header.hero .wrap{grid-template-columns:1fr}.counts{order:2}.lang{justify-content:flex-start;margin-top:0}.grid{grid-template-columns:1fr}.search{flex:1 1 100%;min-width:0;margin-left:0}
  .counts{display:none}
  .bar .wrap{padding-block:10px;gap:8px}
  .row1{gap:8px}.tabs{width:100%;flex-wrap:nowrap;gap:6px}.tab{flex:1 1 auto;justify-content:center;padding:10px 6px;gap:5px;white-space:nowrap;font-size:calc(14px*var(--fs))}.tab em{padding:0 6px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}.chip{flex:none;white-space:nowrap}
  .search input{font-size:16px}
  .card{padding:14px 14px}}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}}
</style>
</head>
<body>


<header class="hero"><div class="wrap">
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>

<script>
const DATA={"sellers":[{"table":1,"name":"Andalucía","ko":"안달루시아 관광청","cat":"dmo","website":"https://www.andalucia.org/","type_ko":"지역 관광청","type_en":"Regional tourism board","region_ko":"안달루시아 (세비야·그라나다·코르도바·말라가 등)","region_en":"Andalusia (Seville, Granada, Córdoba, Málaga, etc.)","desc_ko":"스페인 남부 안달루시아 자치주 정부의 관광 홍보 기관. 이슬람과 기독교 문화가 어우러진 유산 도시, 플라멩코, 지중해 휴양지를 한 지역에서 묶어 상품화할 수 있다.","desc_en":"The tourism promotion body of the regional government of Andalusia in southern Spain. The region combines Moorish and Christian heritage cities, flamenco and Mediterranean resorts in one destination.","points_ko":["그라나다 알함브라, 코르도바 메스키타, 세비야 대성당·알카사르 등 대표 세계유산","플라멩코의 본고장, 하얀 마을(푸에블로 블랑코) 등 남부 스페인 감성 콘텐츠","말라가·코스타 델 솔 해안 휴양지와 미식","스페인 일주 상품의 핵심 구간 (마드리드·바르셀로나와 고속철 연결)"],"points_en":["UNESCO icons: the Alhambra (Granada), the Mezquita (Córdoba), Seville Cathedral and Alcázar","Home of flamenco and the white villages (pueblos blancos)","Málaga and Costa del Sol beach resorts and gastronomy","Core leg of Spain tours, linked by high-speed rail to Madrid and Barcelona"]},{"table":2,"name":"Across Spain DMC & Leisure Travel","ko":"어크로스 스페인 DMC & 레저 트래블","cat":"dmc","website":"https://www.across-spain.es/","type_ko":"DMC (현지 랜드사)","type_en":"Destination management company (DMC)","region_ko":"바르셀로나 본사 (마드리드 사무소), 스페인·포르투갈·모로코","region_en":"Barcelona-based (office in Madrid); Spain, Portugal and Morocco","desc_ko":"2004년 설립된 바르셀로나 기반 DMC. 스페인을 중심으로 포르투갈·모로코까지 단체·개별(FIT) 여행, 럭셔리, 스포츠, MICE 프로그램을 운영한다.","desc_en":"A Barcelona-based DMC founded in 2004. It handles group and FIT leisure travel, luxury, sports and MICE programmes across Spain, extending to Portugal and Morocco.","points_ko":["스페인·포르투갈·모로코 연계 일정 수배","단체 패키지와 FIT 맞춤 일정 모두 대응","럭셔리 여행(전용 차량·고급 숙소), 스포츠 이벤트, 인센티브·컨벤션 등 MICE","바르셀로나·마드리드 외 자카르타 사무소 운영으로 아시아 시장 경험 보유"],"points_en":["Combined Spain, Portugal and Morocco itineraries","Both group packages and tailor-made FIT","Luxury travel, sports events and MICE (incentives, conventions)","Offices in Barcelona and Madrid, plus Jakarta, giving Asia-market experience"]},{"table":3,"name":"Greater Madrid","ko":"마드리드 주 관광청","cat":"dmo","website":"https://www.visitmadrid.es/","type_ko":"지역 관광청","type_en":"Regional tourism board","region_ko":"마드리드 주 (마드리드 시 주변 179개 지자체)","region_en":"Region (Comunidad) of Madrid","desc_ko":"마드리드 주 정부의 관광 브랜드로, '마드리드 시 그 이상'을 내세워 수도 주변의 세계유산 도시와 자연·미식 목적지를 알린다. 마드리드 체류 일정에 당일·1박 근교 여행을 더하기 좋다.","desc_en":"The tourism brand of the Region of Madrid, promoting 'more than Madrid': UNESCO towns, nature and food destinations around the capital. Ideal for adding day trips or overnight extensions to a Madrid stay.","points_ko":["엘 에스코리알·아란후에스·알칼라 데 에나레스 등 세계유산 근교 도시","과다라마 산맥 국립공원 등 자연·하이킹","'비노스 데 마드리드' 와인과 마드리드 전통 요리","마드리드 시내에서 기차·버스로 이동하기 쉬운 근교 당일 일정"],"points_en":["UNESCO towns near the capital: El Escorial, Aranjuez, Alcalá de Henares","Nature and hiking in Sierra de Guadarrama National Park","Vinos de Madrid wines and traditional Madrid cuisine","Easy day trips by train or coach from central Madrid"]},{"table":4,"name":"PARADORES Hoteles y Restaurantes 1928","ko":"파라도르 호텔 & 레스토랑 1928","cat":"hotel","website":"https://www.paradores.es/","type_ko":"국영 호텔 체인","type_en":"State-owned hotel chain","region_ko":"스페인 전역 (마드리드 본사)","region_en":"Nationwide across Spain (HQ Madrid)","desc_ko":"1928년 첫 파라도르 개관 이후 스페인 정부가 운영해 온 국영 호텔 체인. 고성·수도원·궁전 등 역사 건축물과 경관 좋은 자연 속에 호텔을 두고, 지역 요리 레스토랑을 함께 운영한다.","desc_en":"Spain's state-owned hotel chain, operating since the first parador opened in 1928. Hotels sit in castles, monasteries, palaces and scenic natural settings, each with a restaurant serving regional cuisine.","points_ko":["스페인 전역 약 100곳 네트워크로 일주 상품 숙박 구성에 유리","그라나다(알함브라 내부)·레온·산티아고 등 역사 건축물 호텔","향토 요리 중심 레스토랑으로 숙박+미식 상품화","이비사 등 신규 개관과 리노베이션으로 네트워크 확대"],"points_en":["Network of around 100 hotels across Spain, ideal for touring itineraries","Heritage-building hotels such as Granada (inside the Alhambra), León and Santiago","Restaurants focused on regional cuisine for stay-and-dine products","Expanding with new openings such as Ibiza and network-wide renovations"]},{"table":5,"name":"Axencia Turismo de Galicia","ko":"갈리시아 관광청","cat":"dmo","website":"https://www.turismo.gal/","type_ko":"지역 관광청","type_en":"Regional tourism board","region_ko":"갈리시아 (산티아고 데 콤포스텔라·아 코루냐·비고 등)","region_en":"Galicia (Santiago de Compostela, A Coruña, Vigo, etc.)","desc_ko":"스페인 북서부 갈리시아 자치주 정부의 관광 기관. 산티아고 순례길의 종착지 산티아고 데 콤포스텔라와 대서양 해안·해산물 미식을 대표 상품으로 알린다.","desc_en":"The tourism agency of the regional government of Galicia in north-west Spain. Its flagship products are Santiago de Compostela, end point of the Camino de Santiago, and the Atlantic coast and its seafood.","points_ko":["산티아고 순례길(카미노) 종착지, 산티아고 대성당","리아스 바이샤스 해안과 해산물·알바리뇨 와인","루고 로마 성벽, 헤라클레스 탑 등 세계유산","순례길 걷기·도보 상품 등 한국 시장에서 인지도 높은 테마"],"points_en":["End of the Camino de Santiago and Santiago Cathedral","Rías Baixas coast, seafood and Albariño wine","UNESCO sites: Roman walls of Lugo, Tower of Hercules","Camino walking products, a theme already well known in Korea"]},{"table":6,"name":"Turismo de Aragón","ko":"아라곤 관광청","cat":"dmo","website":"https://www.turismodearagon.com/","type_ko":"지역 관광청","type_en":"Regional tourism board","region_ko":"아라곤 (사라고사·우에스카·테루엘)","region_en":"Aragón (Zaragoza, Huesca, Teruel)","desc_ko":"스페인 북동부 아라곤 자치주 정부의 관광 기관. 마드리드–바르셀로나 고속철 노선의 중간 지점인 사라고사를 거점으로 무데하르 건축 유산과 피레네 산악 자연을 알린다.","desc_en":"The tourism body of the Aragón regional government in north-east Spain. Based around Zaragoza, midway on the Madrid–Barcelona high-speed line, it promotes Mudéjar heritage and the Pyrenees.","points_ko":["사라고사 필라르 성모 대성당, 알하페리아 궁전","테루엘 등 세계유산 아라곤 무데하르 건축","피레네 오르데사 이 몬테 페르디도 국립공원 등 산악 자연","알바라신 등 중세 마을, 마드리드–바르셀로나 이동 중 경유 가능"],"points_en":["Basilica of El Pilar and Aljafería Palace in Zaragoza","UNESCO-listed Mudéjar architecture of Aragón, including Teruel","Pyrenees nature, including Ordesa y Monte Perdido National Park","Medieval villages such as Albarracín; easy stopover between Madrid and Barcelona"]},{"table":7,"name":"Galiwonders","ko":"갈리원더스","cat":"dmc","website":"https://galiwonders.com/","type_ko":"순례길 전문 여행사·DMC","type_en":"Camino de Santiago specialist tour operator / DMC","region_ko":"갈리시아 산티아고 데 콤포스텔라","region_en":"Santiago de Compostela, Galicia","desc_ko":"산티아고 데 콤포스텔라에 기반을 둔 산티아고 순례길 전문 여행사. 주요 카미노 루트의 숙소·짐 운송·차량을 묶은 맞춤 일정과 함께 갈리시아 인바운드 DMC 서비스를 제공한다.","desc_en":"A Santiago de Compostela-based tour operator specialising in the Camino de Santiago. It offers tailor-made Camino packages with accommodation, luggage transfer and transport, plus inbound DMC services for Galicia.","points_ko":["프랑스길·포르투갈길·북쪽길·프리미티보길 등 주요 카미노 루트 전반","셀프 가이드·단체·자전거 순례 등 다양한 형태, 숙소·짐 운송·24시간 지원 포함","포르투갈·이탈리아(비아 프란치제나) 등 순례길 확장 상품","갈리시아 현지 체험과 연계한 DMC 서비스"],"points_en":["All main Camino routes: French, Portuguese, Northern, Primitive and more","Self-guided, group and cycling options with lodging, luggage transfer and 24/7 support","Extended pilgrimage routes in Portugal and Italy (Via Francigena)","DMC services combining the Camino with Galician experiences"]},{"table":8,"name":"Catalan Tourist Board","ko":"카탈루냐 관광청","cat":"dmo","website":"https://www.catalunya.com/","type_ko":"지역 관광청","type_en":"Regional tourism board","region_ko":"카탈루냐 (바르셀로나·지로나·타라고나·레이다)","region_en":"Catalonia (Barcelona, Girona, Tarragona, Lleida)","desc_ko":"카탈루냐 자치주 정부의 관광 홍보 기관(Agència Catalana de Turisme). 바르셀로나를 중심으로 코스타 브라바 해안, 몬세라트, 피레네, 와인 산지까지 카탈루냐 전역을 알린다.","desc_en":"The Catalan government's tourism promotion agency (Agència Catalana de Turisme). It promotes all of Catalonia, from Barcelona to the Costa Brava, Montserrat, the Pyrenees and wine regions.","points_ko":["바르셀로나 가우디 건축(사그라다 파밀리아 등 세계유산)","몬세라트 수도원, 지로나, 피게레스 달리 극장 박물관 등 근교 명소","코스타 브라바·코스타 다우라다 지중해 해안","페네데스 카바 등 와인·미식 관광"],"points_en":["Gaudí's Barcelona, including the UNESCO-listed Sagrada Família","Day-trip highlights: Montserrat, Girona, the Dalí Theatre-Museum in Figueres","Mediterranean coasts: Costa Brava and Costa Daurada","Wine and food tourism, including Penedès cava"]},{"table":9,"name":"iryo","ko":"이리요(iryo)","cat":"trans","website":"https://iryo.eu/","type_ko":"고속철도 운영사","type_en":"High-speed rail operator","region_ko":"스페인 고속철 노선 (마드리드 거점)","region_en":"Spanish high-speed network (Madrid hub)","desc_ko":"2022년 11월 운행을 시작한 스페인 민간 고속철도 운영사. 트렌이탈리아·에어 노스트룸·글로발비아가 주주로 참여하며, 이탈리아 프레차로사 1000 차량으로 마드리드와 주요 도시를 잇는다.","desc_en":"A private Spanish high-speed rail operator that began service in November 2022. Its shareholders are Trenitalia, Air Nostrum and Globalvia, and it runs Frecciarossa 1000 trains linking Madrid with major cities.","points_ko":["마드리드–바르셀로나(사라고사 경유), 발렌시아, 알리칸테 노선","안달루시아 코르도바·세비야·말라가 연결, 바르셀로나–세비야·말라가 직통도 운행","전 좌석 콘센트·무료 와이파이, 카페 바를 갖춘 프레차로사 1000 차량","일반석부터 식사 포함 1등석(Infinita Bistró)까지 등급별 운임"],"points_en":["Madrid–Barcelona (via Zaragoza), Valencia and Alicante routes","Andalusia links to Córdoba, Seville and Málaga, plus Barcelona–Seville/Málaga","Frecciarossa 1000 trains with sockets at every seat, free Wi-Fi and a café-bar","Fare classes from standard to first class with meal (Infinita Bistró)"]},{"table":10,"name":"Extremadura Tourism Board","ko":"엑스트레마두라 관광청","cat":"dmo","website":"https://www.turismoextremadura.com/","type_ko":"지역 관광청","type_en":"Regional tourism board","region_ko":"엑스트레마두라 (카세레스·메리다·바다호스 등)","region_en":"Extremadura (Cáceres, Mérida, Badajoz, etc.)","desc_ko":"스페인 서부 포르투갈 접경 엑스트레마두라 자치주 정부의 관광 기관. 로마 유적과 중세 구시가지, 넓은 데에사 초원과 이베리코 햄 등 덜 알려진 스페인을 알린다.","desc_en":"The tourism body of the regional government of Extremadura in western Spain, bordering Portugal. It promotes a less-visited Spain of Roman ruins, medieval old towns, dehesa landscapes and Iberian ham.","points_ko":["카세레스 구시가지, 메리다 로마 유적, 과달루페 수도원 등 세계유산","몬프라궤 국립공원 등 조류 관찰·자연 관광","이베리코 햄, 토르타 델 카사르 치즈 등 미식","마드리드와 리스본 사이에 있어 스페인–포르투갈 연계 일정에 적합"],"points_en":["UNESCO sites: Cáceres old town, Roman Mérida, Guadalupe Monastery","Birdwatching and nature in Monfragüe National Park","Gastronomy: Iberian ham, Torta del Casar cheese","Located between Madrid and Lisbon, suited to Spain–Portugal itineraries"]},{"table":11,"name":"Basque Country","ko":"바스크 관광청","cat":"dmo","website":"https://turismo.euskadi.eus/","type_ko":"지역 관광청","type_en":"Regional tourism board","region_ko":"바스크 (빌바오·산 세바스티안·비토리아-가스테이스)","region_en":"Basque Country (Bilbao, San Sebastián, Vitoria-Gasteiz)","desc_ko":"스페인 북부 바스크 자치주 정부의 관광 기관. 미식 도시 산 세바스티안, 구겐하임 미술관의 빌바오, 대서양 해안과 리오하 알라베사 와인 산지를 대표 콘텐츠로 알린다.","desc_en":"The tourism body of the Basque regional government in northern Spain. Its headline draws are gourmet San Sebastián, Guggenheim Bilbao, the Atlantic coast and the Rioja Alavesa wine area.","points_ko":["산 세바스티안 핀초스 바와 미쉐린 레스토랑 등 미식 여행","빌바오 구겐하임 미술관과 현대 건축","산 후안 데 가스텔루가체 등 대서양 해안 경관","리오하 알라베사 와이너리 투어, 독자적인 바스크 언어·문화"],"points_en":["Food travel: San Sebastián pintxos bars and Michelin-starred restaurants","Guggenheim Museum Bilbao and contemporary architecture","Atlantic coastal scenery such as San Juan de Gaztelugatxe","Rioja Alavesa winery tours and distinctive Basque language and culture"]},{"table":12,"name":"Sol-Active Tours","ko":"솔 액티브 투어스","cat":"dmc","website":"https://solactivetours.com/","type_ko":"인커밍 여행사 (B2B 랜드사)","type_en":"Incoming travel agency (B2B DMC)","region_ko":"카탈루냐 타라고나 코스타 다우라다 (살로우 일대)","region_en":"Costa Daurada, Tarragona, Catalonia (Salou area)","desc_ko":"카탈루냐 코스타 다우라다에 기반을 둔 인커밍 여행사로 2007년 설립됐다. 여행사·투어 운영사·학교·기업 등을 대상으로 스포츠·어학·기업 단체 맞춤 일정을 B2B로 운영한다.","desc_en":"An incoming agency based on Catalonia's Costa Daurada, founded in 2007. It works B2B for travel agencies, tour operators, schools and companies, building tailor-made sports, language and corporate group trips.","points_ko":["단체 여행 전문, 예산·목적에 맞춘 맞춤 일정","스포츠 패키지(친선 경기·심판·코치 수배), 카탈루냐 공인 스포츠 이벤트 운영사","어학 연수·학교 단체 프로그램","기업 팀빌딩·인센티브, 가이드 투어·문화 체험 추가 옵션"],"points_en":["Group travel specialist with tailor-made itineraries","Sports packages (friendly matches, referees, coaches); authorised sports-event operator in Catalonia","Language-immersion and school group programmes","Corporate team-building and incentives, with guided tours and cultural workshops as add-ons"]},{"table":13,"name":"Visit Palma de Mallorca","ko":"팔마 데 마요르카 시 관광청","cat":"dmo","website":"https://visitpalma.com/","type_ko":"도시 관광청","type_en":"City tourism board","region_ko":"발레아레스 제도 마요르카 섬 팔마","region_en":"Palma, Mallorca (Balearic Islands)","desc_ko":"팔마 시청과 발레아레스 항만청, 민간 회원이 함께 운영하는 팔마 관광 재단(Fundació Turisme Palma de Mallorca 365). 지중해 섬 도시 팔마를 연중 여행지로 알리고 크루즈·요트 관광도 홍보한다.","desc_en":"The Palma tourism foundation (Fundació Turisme Palma de Mallorca 365), a public–private body of Palma City Council, the Balearic Ports Authority and private members. It promotes Palma as a year-round Mediterranean city destination, including cruise and nautical tourism.","points_ko":["팔마 대성당(라 세우), 벨베르 성, 구시가지","도시 관광과 지중해 해변·섬 휴양을 함께 즐기는 목적지","크루즈 기항지, 요트·해양 관광","바르셀로나 등 스페인 본토 일정에 섬 여행 연계 가능"],"points_en":["Palma Cathedral (La Seu), Bellver Castle and the old town","City sightseeing combined with Mediterranean beaches and island leisure","Cruise port and yachting/nautical tourism","Easy island add-on to mainland Spain itineraries such as Barcelona"]},{"table":14,"name":"El Corte Inglés","ko":"엘 코르테 잉글레스","cat":"exp","website":"https://www.elcorteingles.es","type_ko":"백화점·리테일 그룹","type_en":"Department store group","region_ko":"마드리드 본사, 스페인·포르투갈 전역","region_en":"Madrid (HQ), Spain and Portugal","desc_ko":"1940년 마드리드에서 출발한 스페인 최대 백화점 그룹으로, 유럽 최대 규모의 백화점 체인으로 꼽힌다. 스페인과 포르투갈 주요 도시에 매장을 두고 있으며, 외국인 관광객 전용 인터내셔널 데스크와 택스프리 서비스를 운영한다.","desc_en":"Founded in Madrid in 1940, El Corte Inglés is Spain's leading department store group and is described as the largest in Europe. It operates stores in major cities across Spain and Portugal, with dedicated services for international visitors.","points_ko":["비EU 관광객 대상 부가세 환급 최대 15.7%, 인터내셔널 쇼핑 데스크 운영","해외 고객용 10% 리워드 카드, 퍼스널 쇼퍼·VIP 컨시어지·해외 배송·환전 서비스","마드리드 카스테야나·바르셀로나 디아고날 등 주요 도시 대형 매장과 '구르메 익스피리언스' 미식 공간","단체 방문은 인터내셔널 데스크 컨시어지를 통해 안내"],"points_en":["VAT refunds of up to 15.7% for non-EU visitors via the International Shopping Bureau","10% reward card for international clients, personal shopper, VIP concierge, international shipping and currency exchange","Flagship stores such as Castellana (Madrid) and Diagonal (Barcelona), with Gourmet Experience food halls","Group visits arranged through the International Desk concierge"]},{"table":15,"name":"Madrid City Tourism","ko":"마드리드 시 관광청","cat":"dmo","website":"https://www.esmadrid.com","type_ko":"시 관광청","type_en":"City tourism board","region_ko":"스페인 마드리드시","region_en":"City of Madrid","desc_ko":"스페인의 수도 마드리드시의 공식 관광 기관으로, 마드리드시 산하 마드리드 데스티노(Madrid Destino)가 공식 관광 포털 esMADRID를 운영한다. 세계적 미술관과 왕궁, 미식·쇼핑·플라멩코를 아우르는 도시 관광과 MICE 유치를 함께 맡는다.","desc_en":"The official tourism body of Spain's capital; the official portal esMADRID is run by Madrid Destino under Madrid City Council. It promotes the city's art, heritage, gastronomy, shopping and flamenco, as well as meetings and events.","points_ko":["프라도·레이나 소피아·티센 미술관이 모인 '예술의 삼각지대'","유네스코 세계유산 '파세오 델 프라도와 레티로 공원'","유럽 최대급 왕궁인 마드리드 왕궁과 구시가지 산책","미식·쇼핑·플라멩코 등 도시형 체험과 마드리드 컨벤션 뷰로를 통한 MICE 지원"],"points_en":["The Golden Triangle of Art: Prado, Reina Sofía and Thyssen museums","UNESCO World Heritage: Paseo del Prado and El Retiro Park","Royal Palace, one of Europe's largest, and the historic centre","Food, shopping and flamenco experiences; MICE support via Madrid Convention Bureau"]},{"table":16,"name":"Turismo Castilla-La Mancha","ko":"카스티야 라 만차 관광청","cat":"dmo","website":"https://www.turismocastillalamancha.es","type_ko":"주(州) 관광청","type_en":"Regional tourism board","region_ko":"카스티야 라 만차 주 (주도 톨레도), 마드리드 남쪽","region_en":"Castilla-La Mancha region (capital Toledo), south of Madrid","desc_ko":"마드리드 남쪽에 펼쳐진 카스티야 라 만차 주 정부의 관광 기관이다. 세계유산 도시 톨레도와 쿠엥카, 『돈키호테』의 무대인 라 만차 평원을 품고 있어 마드리드 근교 연계 상품에 적합하다.","desc_en":"The tourism authority of the regional government of Castilla-La Mancha, south of Madrid. Home to the World Heritage cities of Toledo and Cuenca and the La Mancha plains of Don Quixote, it pairs naturally with Madrid itineraries.","points_ko":["유네스코 세계유산 도시 톨레도·쿠엥카","돈키호테의 무대 라 만차 풍차 마을 (콘수에그라 등)","만체고 치즈, 사프란, 와이너리 투어 등 미식 체험","톨레도 도검·탈라베라 도자기 등 전통 공예"],"points_en":["UNESCO World Heritage cities of Toledo and Cuenca","Don Quixote's La Mancha and its windmill villages (e.g., Consuegra)","Gastronomy: Manchego cheese, saffron and winery visits","Traditional crafts such as Toledo swords and Talavera ceramics"]},{"table":17,"name":"NIS","ko":"NIS 노스 인커밍 서비스","cat":"dmc","website":"https://www.nis.es","type_ko":"인커밍 여행사·DMC","type_en":"Incoming tour operator / DMC","region_ko":"빌바오 본사, 바스크 지방·스페인 북부","region_en":"Bilbao (HQ), Basque Country and northern Spain","desc_ko":"1992년부터 빌바오에서 활동해 온 인커밍 전문 여행사(North Incoming Service)다. 바스크 지방을 중심으로 스페인 북부 일대의 개별·소그룹 여행, 미식·와인 투어, 인센티브·MICE와 크루즈 기항지 투어를 운영한다.","desc_en":"North Incoming Service is a Bilbao-based incoming tour operator and travel agency operating since 1992. It designs leisure, small-group, food & wine and MICE programmes across the Basque Country and northern Spain, including cruise shore excursions.","points_ko":["빌바오·비스카야, 산세바스티안, 게르니카, 프랑스 바스크 해안까지 커버","리오하 알라베사 와인, 나바라·칸타브리아·부르고스 연계 일정","바스크 요리 쿠킹 클래스 등 미식·와인 체험","인센티브·컨벤션·크루즈 기항지 투어 등 MICE 운영"],"points_en":["Covers Bilbao & Biscay, San Sebastián, Gernika and the French Basque coast","Extensions to Rioja Alavesa wine country, Navarre, Cantabria and Burgos","Food & wine programmes including Basque cooking experiences","MICE: incentives, conventions and cruise shore excursions"]},{"table":18,"name":"Turismo Málaga","ko":"말라가 시 관광청","cat":"dmo","website":"https://visita.malaga.eu","type_ko":"시 관광청","type_en":"City tourism board","region_ko":"안달루시아 말라가시 (코스타 델 솔)","region_en":"City of Málaga, Andalusia (Costa del Sol)","desc_ko":"피카소의 고향이자 코스타 델 솔의 관문인 말라가시의 공식 관광 기관이다. 40곳 가까운 박물관과 이슬람·로마 유적, 해변과 미식을 함께 즐길 수 있는 안달루시아의 대표 도시로 소개한다.","desc_en":"The official tourism office of the City of Málaga, Picasso's birthplace and the gateway to the Costa del Sol. It promotes a city of museums, Moorish and Roman heritage, beaches and Andalusian gastronomy.","points_ko":["피카소 생가 박물관과 말라가 피카소 미술관","알카사바·히브랄파로 성·로마 극장·대성당 등 역사 유적","퐁피두 센터 말라가 등 40곳 가까운 박물관이 모인 '박물관의 도시'","코스타 델 솔 해변 휴양과 안달루시아 주요 도시 연계 거점"],"points_en":["Picasso's Birthplace Museum and Museo Picasso Málaga","Alcazaba, Gibralfaro Castle, Roman Theatre and the Cathedral","A 'city of museums' with nearly 40 museums, including Centre Pompidou Málaga","Costa del Sol beaches and a base for touring Andalusia"]},{"table":19,"name":"Bodega Familia Torres","ko":"파밀리아 토레스 와이너리","cat":"exp","website":"https://www.torres.es","type_ko":"와이너리","type_en":"Family-owned winery","region_ko":"카탈루냐 페네데스(빌라프랑카 델 페네데스) 본사, 스페인 각지·칠레·미국","region_en":"Vilafranca del Penedès, Catalonia (HQ); vineyards across Spain, Chile and California","desc_ko":"1870년 바르셀로나 근교 페네데스에서 설립된 가족 경영 와이너리로, 현재 5대째 이어지고 있다. 카탈루냐를 비롯해 리오하·리베라 델 두에로 등 스페인 주요 산지와 칠레·캘리포니아에 포도밭을 두고, 와이너리 투어와 시음 체험을 운영한다.","desc_en":"A family-owned winery founded in 1870 in Penedès near Barcelona and now led by the fifth generation. It farms vineyards in Catalonia, Rioja, Ribera del Duero and other Spanish regions as well as Chile and California, and offers winery visits and tastings.","points_ko":["바르셀로나 근교 페네데스 와이너리 투어·포도밭 방문·페어링 시음","포도밭 옆 레스토랑 '엘 세예렛'에서의 식사 체험","마스 라 플라나·그란스 무랄레스 등 대표 와인과 토레스 브랜디","B Corp 인증과 기후 대응·재생 농법 등 지속가능 경영"],"points_en":["Winery and vineyard tours with tastings and food pairings in Penedès near Barcelona","Dining at El Celleret restaurant beside the vineyards","Iconic wines such as Mas La Plana and Grans Muralles, plus Torres brandies","B Corp certified, with climate action and regenerative viticulture"]},{"table":20,"name":"Turismo Gran Canaria","ko":"그란 카나리아 섬 관광청","cat":"dmo","website":"https://www.grancanaria.com","type_ko":"섬 관광청","type_en":"Island tourism board","region_ko":"카나리아 제도 그란 카나리아섬","region_en":"Gran Canaria, Canary Islands","desc_ko":"대서양 카나리아 제도의 그란 카나리아섬 관광청이다. 연중 온화한 기후와 약 240km에 이르는 해안선, 사구와 화산 산악 지형이 어우러진 섬 전체가 유네스코 생물권보전지역으로 지정되어 있다.","desc_en":"The tourist board of Gran Canaria in the Atlantic Canary Islands. With a mild year-round climate, almost 150 miles of coastline, dunes and volcanic highlands, the island is a UNESCO World Biosphere Reserve.","points_ko":["마스팔로마스 사구 자연보호구역과 다양한 해변","로케 누블로 등 화산 산악 지대 트레킹","별 관측 명소로 인증된 '스타라이트' 목적지","라스팔마스 구시가지 베게타 등 도시 관광과 연중 휴양"],"points_en":["Maspalomas Dunes Special Nature Reserve and a wide choice of beaches","Hiking in the volcanic highlands around Roque Nublo","Certified Starlight destination for stargazing","Las Palmas and its historic Vegueta quarter; a year-round climate"]},{"table":21,"name":"Turismo Provincia de Cáceres / Diputación de Cáceres","ko":"카세레스 관광청","cat":"dmo","website":"https://livinglavidacaceres.com","type_ko":"도(provincia) 관광청","type_en":"Provincial tourism board","region_ko":"엑스트레마두라 주 카세레스도","region_en":"Province of Cáceres, Extremadura","desc_ko":"스페인 서부 엑스트레마두라 주 카세레스도 의회(Diputación de Cáceres)의 관광 기관이다. 세계유산 도시와 수도원, 국립공원, 봄 벚꽃 계곡을 아우르는 자연·역사 관광과 미식 관광을 홍보한다.","desc_en":"The tourism service of the Provincial Council of Cáceres in Extremadura, western Spain. It promotes World Heritage towns and monasteries, a national park, spring cherry blossoms and gastronomy across the province.","points_ko":["유네스코 세계유산 카세레스 구시가지와 과달루페 수도원","정복자 피사로의 고향 트루히요 등 중세 도시","몬프라궤 국립공원 (생물권보전지역, 조류 관찰·별 관측)","봄철 벚꽃 명소 헤르테 계곡과 이베리코 햄 등 미식"],"points_en":["UNESCO World Heritage: Old Town of Cáceres and Guadalupe Monastery","Medieval towns such as Trujillo, birthplace of Pizarro","Monfragüe National Park and Biosphere Reserve (birdwatching, Starlight)","Spring cherry blossom in the Jerte Valley and Iberian gastronomy"]},{"table":22,"name":"MY WAY Santiago","ko":"마이 웨이 산티아고","cat":"dmc","website":"https://mywaysantiago.com","type_ko":"프리미엄 맞춤 여행사","type_en":"Premium bespoke travel agency","region_ko":"스페인 갈리시아","region_en":"Galicia, Spain","desc_ko":"갈리시아를 기반으로 산티아고 순례길과 갈리시아 지역 맞춤 여행을 기획하는 프리미엄 여행사다. 현지 파트너와 협업해 프라이빗 가이드, 미식, 이색 체험을 결합한 일정을 만든다.","desc_en":"A premium travel agency based in Galicia specialising in bespoke Camino de Santiago and Galicia itineraries. Working closely with locals, it combines private guides, gastronomy and exclusive experiences.","points_ko":["프랑스길(사리아 출발)·포르투갈길·북쪽길·영국길 등 순례길 맞춤 일정","혼잡을 피한 '겨울길'·'잊혀진 길' 등 대안 순례 루트와 프리미엄 숙소","미쉐린 레스토랑, 알바리뇨 와인 시음, 열기구, 리아스 바이샤스 항해 등 갈리시아 체험","인센티브·팀빌딩 등 기업 프로그램과 컨시어지 서비스"],"points_en":["Tailor-made Camino itineraries: French Way (from Sarria), Portuguese, Northern and English Ways","Less-travelled routes (Winter Way, Forgotten Way) with premium accommodation","Galician experiences: Michelin dining, Albariño tastings, hot-air balloons, sailing the Rías Baixas","Incentives, team-building and concierge services"]},{"table":23,"name":"Bilbao Bizkaia Be Basque","ko":"빌바오 시·비스카야 도 관광청 Be Basque","cat":"dmo","website":"https://www.visitbiscay.eus","type_ko":"시·도 관광청","type_en":"City and provincial tourism board","region_ko":"바스크 지방 빌바오시·비스카야도","region_en":"Bilbao and the province of Biscay (Bizkaia), Basque Country","desc_ko":"빌바오시와 비스카야도가 함께 쓰는 관광 브랜드 'Bilbao Bizkaia Be Basque'로, 도시와 해안, 산을 하나의 목적지로 홍보한다. 구겐하임 미술관으로 대표되는 현대 도시 빌바오와 대서양 해안 절경을 함께 소개한다.","desc_en":"Bilbao Bizkaia Be Basque is the joint tourism brand of the city of Bilbao and the province of Biscay, promoting coast, city and mountains as one destination. It pairs the Guggenheim-era city with the dramatic Atlantic coastline.","points_ko":["빌바오의 상징 구겐하임 미술관","절벽 위 예배당 산 후안 데 가스텔루가체","세계 최초 운반교이자 유네스코 세계유산 비스카야 다리","유네스코 생물권보전지역 우르다이바이, 핀초스·차콜리 등 바스크 미식"],"points_en":["The Guggenheim Museum Bilbao","San Juan de Gaztelugatxe hermitage on its islet","Bizkaia Bridge, the world's first transporter bridge and a UNESCO site","Urdaibai Biosphere Reserve; Basque pintxos and txakoli"]},{"table":24,"name":"Grupo Cordobés","ko":"그루포 코르도베스 (플라멩코 공연장)","cat":"exp","website":"https://tablaocordobes.es","type_ko":"플라멩코 공연장 (타블라오)","type_en":"Flamenco venue (tablao)","region_ko":"바르셀로나 람블라스 거리","region_en":"La Rambla, Barcelona","desc_ko":"1970년 플라멩코 예술가 가문인 아다메 가(家)가 바르셀로나 람블라스 거리에 문을 연 '타블라오 플라멩코 코르도베스'를 운영한다. 정통 플라멩코 공연과 스페인·카탈루냐 요리를 함께 즐기는 디너쇼로 잘 알려져 있으며, 인근에 플라멩코 바 'El Duende'도 운영한다.","desc_en":"Operator of Tablao Flamenco Cordobés, opened on La Rambla in Barcelona in 1970 by the Adame family of flamenco artists. It is known for authentic flamenco shows paired with Spanish and Catalan cuisine, and also runs the flamenco bar El Duende nearby.","points_ko":["1970년 개관, 카마론 데 라 이슬라 등 전설적 예술가가 선 바르셀로나 대표 타블라오","마이크 없이 울리는 소규모 아치형 공연장 (최대 약 180석), 연중 매일 공연","40가지 이상의 스페인·카탈루냐 요리와 함께하는 디너+공연 구성","람블라스 33번지 플라멩코 바 'El Duende', MICE·단체 상담과 한국어 웹페이지"],"points_en":["Opened in 1970; legendary artists such as Camarón de la Isla have performed here","Intimate vaulted rooms (up to about 180 guests) with unamplified sound; shows daily all year","Dinner-and-show packages with 40+ Spanish and Catalan specialities","El Duende flamenco bar at La Rambla 33; MICE/group enquiries; Korean-language web pages"]},{"table":25,"name":"Turismo de Salamanca","ko":"살라망카 시 관광청","cat":"dmo","website":"https://www.salamanca.es","type_ko":"시 관광청","type_en":"City tourism board","region_ko":"카스티야 이 레온 주 살라망카시","region_en":"City of Salamanca, Castilla y León","desc_ko":"살라망카시의 관광 진흥 공기업(Turismo, Comercio y Promoción Económica de Salamanca)이 운영하는 공식 관광 기관이다. 유네스코 세계유산 구시가지와 1218년 설립된 살라망카 대학을 중심으로 대학 도시이자 스페인어 학습 도시로서의 매력을 소개한다.","desc_en":"The official tourism office run by the city's tourism and economic promotion company. It showcases a UNESCO-listed old city centred on the University of Salamanca, founded in 1218, and the city's role as a centre for learning Spanish.","points_ko":["유네스코 세계유산 살라망카 구시가지","1218년 설립된 유럽 최   const st=document.getElementById("ckst");if(st){let a=0,n=0;DATA.buyers.forEach(x=>{(x.att||[]).forEach((p,i)=>{n++;if(CK[x.no+"-"+i])a++})});st.hidden=false;st.innerHTML=`<b>${esc(t.ckSum)}</b> ${a} / ${n}`+(CKST?` <span class="w">${esc(CKST)}</span>`:"")}}
var CKST="";
async function ckClick(b){const k=b.dataset.ck;if(!CKDB||CKBUSY[k])return;const c=CK[k];
  if(c&&!(CKARM&&CKARM.k===k)){CKARM={k,until:Date.now()+4000};ckPaint();setTimeout(()=>{if(CKARM&&CKARM.k===k&&Date.now()>=CKARM.until){CKARM=null;ckPaint()}},4100);return}
  CKARM=null;CKBUSY[k]=true;ckPaint();const [bno,i]=[k.replace(/-\d+$/,""),+k.split("-").pop()];
  const x=DATA.buyers.find(z=>z.no===bno),p=x&&x.att&&x.att[i];
  try{if(c){await CKDB.doc("checkin/"+k).delete();delete CK[k]}else{const d={b:bno,i,nm:p?p[0]:"",at:Date.now()};await CKDB.doc("checkin/"+k).set(d);CK[k]=d}CKST=""}
  catch(e){CKST=T[L].ckErr}
  CKBUSY[k]=false;ckPaint()}
(async()=>{try{if(!window.claude||!claude.use)return;const db=await claude.use("db");if(!db)return;
  CKDB=db;CKON=true;render();CKST=T[L].ckWait;ckPaint();
  const tm=setTimeout(()=>{CKST=T[L].ckOff;ckPaint()},10000);
  db.collection("checkin").onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{const v=d.data();if(v&&v.at)o[d.id]=v});CK=o;if(!snap.fromCache){clearTimeout(tm);CKST=""}ckPaint()},
    e=>{clearTimeout(tm);CKST=T[L].ckOff;ckPaint()})}catch(e){}})();
render();
</script>
